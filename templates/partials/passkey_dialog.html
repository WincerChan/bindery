<div x-data="binderyPasskeyDialog()" @passkey-open.window="show()" @keydown.escape.window="if (open) close()">
  <div x-cloak x-show="open" x-transition.opacity class="fixed inset-0 sheet-mask z-50 flex items-end md:items-center justify-center md:p-4"
       @click.self="close()"
       @keydown.tab="const nodes = [...$el.querySelectorAll('button,input')].filter(node => !node.disabled &amp;&amp; node.getClientRects().length); const first = nodes[0]; const last = nodes[nodes.length - 1]; if ($event.shiftKey &amp;&amp; document.activeElement === first) { $event.preventDefault(); last.focus(); } else if (!$event.shiftKey &amp;&amp; document.activeElement === last) { $event.preventDefault(); first.focus(); }">
    <section class="modal-panel w-full max-w-md p-6" role="dialog" aria-modal="true" aria-labelledby="passkey-dialog-title" :aria-busy="busy">
      <h2 id="passkey-dialog-title" class="section-title mb-4" x-text="step === 'confirm' ? '确认身份' : '添加通行密钥'"></h2>
      <form x-show="step === 'confirm'" @submit.prevent="confirmPassword()" class="space-y-4">
        <p class="text-ink-3 text-[12.5px]">添加通行密钥前，请输入当前密码。</p>
        <label class="block"><span class="text-[12.5px] text-ink-2">密码</span><input x-ref="passkeyPassword" x-model="password" type="password" class="field w-full mt-1.5" autocomplete="current-password" autofocus required :disabled="busy" /></label>
        <p x-show="message" x-text="message" class="notice-danger text-sm" role="alert"></p>
        <div class="flex justify-end gap-2"><button type="button" class="btn btn-quiet" @click="close()" :disabled="busy">取消</button><button type="submit" class="btn btn-primary" :disabled="busy">继续</button></div>
      </form>
      <form x-show="step === 'name'" @submit.prevent="create()" class="space-y-4">
        <label class="block"><span class="text-[12.5px] text-ink-2">名称</span><input x-ref="passkeyName" x-model="name" type="text" maxlength="40" class="field w-full mt-1.5" placeholder="例如：我的 iPhone" :disabled="busy" /></label>
        <p x-show="message" x-text="message" :class="danger ? 'notice-danger text-sm' : 'text-ink-3 text-xs'" role="status"></p>
        <div class="flex justify-end gap-2"><button type="button" class="btn btn-quiet" @click="close()" :disabled="busy">取消</button><button type="submit" class="btn btn-primary" :disabled="busy">创建通行密钥</button></div>
      </form>
      <div x-show="step === 'waiting'" class="space-y-4" role="status">
        <p class="text-ink-3">请在系统弹窗中完成验证…</p>
        <div class="flex justify-end gap-2"><button type="button" class="btn btn-quiet" disabled>取消</button><button type="button" class="btn btn-primary" disabled>创建通行密钥</button></div>
      </div>
    </section>
  </div>
</div>
