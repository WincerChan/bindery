<div id="library-section" data-page="{{ page }}" data-total-books="{{ total_books }}" class="space-y-6">
  <div id="library" data-view="grid" class="grid library-grid grid-cols-auto-136 data-[view=list]:!grid-cols-1">
    <div data-library-list-head class="hidden col-span-full max-md:hidden">
      <div class="library-list-head max-md:hidden"><span data-book-select-wrap class="hidden"></span><span></span><span>书名 / 作者</span><span>出版</span><span>格式</span><span>更新</span><span></span></div>
    </div>
    {% include "partials/library.html" %}
  </div>
  <div class="pager">
    <div class="font-mono">{{ (page - 1) * per_page + 1 if total_books else 0 }}–{{ (page - 1) * per_page + books|length }} / {{ total_books }}</div>
    <div class="flex items-center gap-2">
      <button type="button" class="btn btn-quiet" {% if not has_prev %}disabled{% endif %} hx-get="/library" hx-target="#library-section" hx-include="#library-controls" hx-vals='{"page":"{{ prev_page }}"}'>上一页</button>
      <span class="font-mono" aria-label="第 {{ page }} / {{ total_pages }} 页">{{ page }} / {{ total_pages }}</span>
      <button type="button" class="btn btn-secondary" {% if not has_next %}disabled{% endif %} hx-get="/library" hx-target="#library-section" hx-include="#library-controls" hx-vals='{"page":"{{ next_page }}"}'>下一页</button>
    </div>
  </div>
</div>
