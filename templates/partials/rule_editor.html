<div
  class="border-t border-line overflow-hidden flex flex-col min-h-0"
  x-data="{
    formatJson() {
      const textarea = this.$refs.configJson;
      if (!textarea) return;
      const raw = (textarea.value || '').trim();
      if (!raw) {
        textarea.value = '';
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        textarea.value = JSON.stringify(parsed, null, 2);
      } catch (error) {
        window.alert('JSON 格式错误，无法格式化');
        textarea.focus();
      }
    }
  }"
>
  <div class="py-3 border-b border-line flex flex-wrap items-center justify-between gap-3">
    <div class="min-w-0">
      <div class="flex items-center gap-2">
        <h3 class="section-title truncate">{{ rule.name }}</h3>
        <span class="px-2 py-0.5 bg-surface text-ok text-xs rounded-[2px] border border-line">v{{ rule.version }}</span>
      </div>
      <div class="text-xs text-ink-3 mt-1 truncate">{{ rule.description or "—" }}</div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      {% if saved %}
        <span class="px-2 py-1 text-xs font-medium bg-surface text-ok rounded-[2px] border border-line">已保存</span>
      {% endif %}
      <button
        form="rule-form"
        type="button"
        @click="formatJson()"
        class="btn btn-secondary"
      >格式化 JSON</button>
      <form
        action="/rules/{{ rule.rule_id }}/delete"
        method="post"
        hx-post="/rules/{{ rule.rule_id }}/delete"
        hx-swap="none"
        onsubmit="return confirm('确定要删除这个规则模板吗？');"
      >
        <button
          class="btn btn-danger"
          type="submit"
          {% if rule.rule_id == "default" %}disabled{% endif %}
        >删除</button>
      </form>
      <button form="rule-form" class="btn btn-primary" type="submit">
        保存
      </button>
    </div>
  </div>

  {% if error %}
    <div class="px-4 py-3 border-b border-danger-line bg-surface text-danger text-sm">
      {{ error }}
    </div>
  {% endif %}

  <div class="flex-1 grid grid-cols-12 gap-4 p-4 min-h-0">
    <form
      id="rule-form"
      action="/rules/{{ rule.rule_id }}/editor"
      method="post"
      hx-post="/rules/{{ rule.rule_id }}/editor"
      hx-target="#rule-editor"
      hx-swap="innerHTML"
      class="col-span-12 lg:col-span-5 border-t border-line flex flex-col overflow-hidden min-h-0"
    >
      <div class="bg-line px-4 py-2 border-b border-line text-xs font-mono text-ink-3 flex justify-between">
        <span>规则 JSON</span>
        <span class="text-ink font-bold">切章</span>
      </div>
      <textarea
        x-ref="configJson"
        name="config_json"
        class="field flex-1 w-full font-mono resize-none min-h-[320px]"
        placeholder="{\n  \"id\": \"default\",\n  \"name\": \"默认\",\n  \"chapter_patterns\": [\"...\"],\n  \"volume_patterns\": [\"...\"],\n  \"special_headings\": [\"...\"],\n  \"heading_max_len\": 40,\n  \"heading_max_commas\": 1,\n  \"skip_candidate_re\": \"...\"\n}"
      >{{ raw_json }}</textarea>
      <div class="px-4 py-2 text-[11px] text-ink-3 border-t border-line bg-surface">
        保存会直接写入 <span class="font-mono text-ink-2">rules/{{ rule.rule_id }}.json</span>，并校验 JSON 与正则可用性。
      </div>
    </form>

    <div class="col-span-12 lg:col-span-7 bg-surface border-t border-line flex flex-col overflow-hidden  min-h-0">
      <div class="bg-surface px-4 py-2 border-b border-line text-xs font-mono text-ink-3 flex justify-between items-center">
        <span>规则测试</span>
        <span class="text-ink-3">使用当前已保存模板运行</span>
      </div>
      <div class="p-4 space-y-3 min-h-0 flex-1 flex flex-col">
        <form
          action="/rules/test"
          method="post"
          hx-post="/rules/test"
          hx-target="#rule-test-preview"
          hx-swap="innerHTML"
          class="space-y-3"
        >
          <input type="hidden" name="rule_template" value="{{ rule.rule_id }}" />
          <div class="space-y-1">
            <label class="text-[11px] font-semibold text-ink-3 uppercase">示例文本</label>
            <textarea
              name="sample"
              rows="8"
              placeholder="粘贴一段文本（用于验证切章效果）"
              class="field w-full resize-none"
            ></textarea>
          </div>
          <div class="flex gap-2">
            <button class="btn btn-primary" type="submit">运行测试</button>
          </div>
        </form>

        <div id="rule-test-preview" class="border-t border-line p-4 overflow-auto flex-1 min-h-0">
          {% include "partials/rules_preview.html" %}
        </div>
      </div>
    </div>
  </div>
</div>
