{% if preview %}
  <div class="grid grid-cols-2 gap-4 text-sm mb-4">
    <div class="border-t border-line p-3">
      <div class="text-xs font-semibold text-ink-3 uppercase">卷数量</div>
      <div class="text-ink font-mono mt-1">{{ preview.volumes }}</div>
    </div>
    <div class="border-t border-line p-3">
      <div class="text-xs font-semibold text-ink-3 uppercase">章数量</div>
      <div class="text-ink font-mono mt-1">{{ preview.chapters }}</div>
    </div>
  </div>
  <div>
    <h4 class="text-sm font-semibold text-ink mb-2">目录预览</h4>
    <ul class="list-disc pl-5 text-sm text-ink-2 space-y-1">
      {% for item in preview.toc %}
        <li>{{ item }}</li>
      {% endfor %}
    </ul>
  </div>
{% else %}
  <div class="text-sm text-ink-3 text-center py-6">尚未运行测试。</div>
{% endif %}
