<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · Bindery</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
    <link rel="shortcut icon" href="/static/logo.svg" />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body class="min-h-screen flex items-center justify-center bg-bg text-ink px-4 py-12 font-sans">
    <main class="login-column">
      <div class="flex items-center gap-3"><span class="mark" aria-hidden="true"></span><h1 class="text-[26px] font-bold tracking-[-.02em]">Bindery</h1></div>
      <p class="font-mono text-[11px] tracking-[.08em] text-ink-3 mt-2.5">PRIVATE LIBRARY · TXT → EPUB</p>
      <div class="border-t border-ink mt-7 mb-6"></div>
      {% if error %}<div class="notice-danger mb-4 text-sm">{{ error }}</div>{% endif %}
      {% if not hash_configured %}<div class="notice-warn mb-4 text-sm">未配置 BINDERY_PASSWORD_HASH，无法登录。</div>{% endif %}
      <form action="/login" method="post" class="space-y-3.5">
        <input type="hidden" name="next" value="{{ next }}" />
        <label class="flex flex-col gap-1.5"><span class="text-[12.5px] text-ink-2">密码</span><input type="password" name="password" required placeholder="输入访问密码" class="field" autocomplete="current-password" autofocus /></label>
        <button class="btn btn-primary" type="submit">登录</button>
      </form>
    </main>
  </body>
</html>
