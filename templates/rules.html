{% extends "base.html" %}

{% block title %}规则 · Bindery{% endblock %}

{% block content %}
<div class="page-head"><h1 class="page-title">规则与主题</h1><span class="meta">{{ rules|length }} 规则 / {{ themes|length }} 主题</span></div>
{% if error %}
  <div class="max-w-6xl mx-auto mb-4 rounded-[2px] border border-danger-line bg-surface text-danger px-4 py-3 text-sm">
    {{ error }}
  </div>
{% endif %}
<div
  class="flex flex-col md:flex-row gap-6 items-start"
  x-data="{ tab: '{{ initial_tab }}', ruleId: '{{ initial_rule }}', themeId: '{{ initial_theme }}' }"
>
  <div class="w-full md:w-56 flex-shrink-0 border-t border-line flex flex-col overflow-hidden">
    <div class="p-2 border-b border-line grid grid-cols-2 gap-1 bg-surface">
      <button
        type="button"
        @click="tab = 'parsing'"
        :class="tab === 'parsing' ? 'chip-on' : ''"
        class="chip justify-center"
      >

        <span class="text-sm">结构</span>
      </button>
      <button
        type="button"
        @click="tab = 'themes'"
        :class="tab === 'themes' ? 'chip-on' : ''"
        class="chip justify-center"
      >

        <span class="text-sm">样式</span>
      </button>
    </div>

    <div class="overflow-y-auto flex-1 p-2 space-y-1">
      <div class="px-2 py-1 text-[10px] font-bold text-ink-3 uppercase tracking-wider" x-text="tab === 'parsing' ? '切章规则' : '输出主题'"></div>

      <template x-if="tab === 'parsing'">
        <div class="space-y-1">
          {% for rule in rules %}
            <button
              type="button"
              @click="ruleId = '{{ rule.rule_id }}'"
              hx-get="/rules/{{ rule.rule_id }}/editor"
              hx-target="#rule-editor"
              hx-swap="innerHTML"
              :class="ruleId === '{{ rule.rule_id }}' ? 'active' : ''"
              class="rule-item flex items-center justify-between text-left w-full px-3 py-3 text-sm cursor-pointer"
            >
              <div class="truncate font-medium">{{ rule.name }}</div>
              <span class="text-[10px] font-mono text-ink-3">v{{ rule.version }}</span>
            </button>
          {% endfor %}
        </div>
      </template>

      <template x-if="tab === 'themes'">
        <div class="space-y-1">
          {% for theme in themes %}
            <button
              type="button"
              @click="themeId = '{{ theme.theme_id }}'"
              hx-get="/themes/{{ theme.theme_id }}/editor"
              hx-target="#theme-editor"
              hx-swap="innerHTML"
              :class="themeId === '{{ theme.theme_id }}' ? 'active' : ''"
              class="rule-item flex items-center justify-between text-left w-full px-3 py-3 text-sm cursor-pointer"
            >
              <div class="truncate font-medium">{{ theme.name }}</div>
              <span class="text-[10px] font-mono text-ink-3">v{{ theme.version }}</span>
            </button>
          {% endfor %}
        </div>
      </template>
    </div>

    <div class="p-3 border-t border-line bg-surface">
      <div class="grid grid-cols-2 gap-2">
        <form x-show="tab === 'parsing'" action="/rules/new" method="post">
          <button class="btn btn-primary w-full btn-sm" type="submit">+ 新增规则</button>
        </form>
        <form
          x-show="tab === 'parsing'"
          x-bind:action="'/rules/' + ruleId + '/delete'"
          method="post"
          onsubmit="return confirm('确定要删除这个规则模板吗？');"
        >
          <button
            class="btn btn-secondary w-full btn-sm"
            type="submit"
            :disabled="ruleId === 'default'"
            :class="ruleId === 'default' ? 'opacity-50 cursor-not-allowed hover:bg-line' : 'cursor-pointer'"
          >删除规则</button>
        </form>

        <form x-show="tab === 'themes'" action="/themes/new" method="post">
          <button class="btn btn-primary w-full btn-sm" type="submit">+ 新增样式</button>
        </form>
        <form
          x-show="tab === 'themes'"
          x-bind:action="'/themes/' + themeId + '/delete'"
          method="post"
          onsubmit="return confirm('确定要删除这个样式模板吗？');"
        >
          <button
            class="btn btn-secondary w-full btn-sm"
            type="submit"
            :disabled="themeId === 'default'"
            :class="themeId === 'default' ? 'opacity-50 cursor-not-allowed hover:bg-line' : 'cursor-pointer'"
          >删除样式</button>
        </form>
      </div>
      <form
        action="/books/regenerate"
        method="post"
        class="mt-2"
        onsubmit="return confirm('将按当前模板批量重建匹配书籍并进入任务队列，继续吗？');"
      >
        <input type="hidden" name="scope" :value="tab" />
        <input type="hidden" name="template_id" :value="tab === 'themes' ? themeId : ruleId" />
        <button
          type="submit"
          class="btn btn-secondary w-full btn-sm"
        >
          一键批量重建（当前模板）
        </button>
      </form>
    </div>
  </div>

  <div class="flex-1 w-full min-w-0 flex flex-col gap-6 min-h-0">
    <div x-show="tab === 'parsing'" class="flex-1 flex flex-col gap-4 min-h-0">
      {% if rules %}
        <div
          id="rule-editor"
          hx-get="/rules/{{ initial_rule }}/editor"
          hx-trigger="load"
          class="min-h-0"
        ></div>
      {% else %}
        <div class="border-t border-line p-6 text-sm text-ink-3 text-center">暂无规则模板。</div>
      {% endif %}
    </div>

    <div x-show="tab === 'themes'" class="flex-1 min-h-0">
      {% if themes %}
        <div
          id="theme-editor"
          hx-get="/themes/{{ initial_theme }}/editor"
          hx-trigger="load"
          class="min-h-0"
        ></div>
      {% else %}
        <div class="border-t border-line p-6 text-sm text-ink-3 text-center">暂无主题模板。</div>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
