<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bindery 书的菜单 · 手机</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F4EE}
a{color:#A24832}a:hover{color:#202923}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6F4EE; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; color: #202923">

  <!-- The shelf behind, simplified -->
  <div aria-hidden="true" style="box-sizing: border-box; padding: 28px 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 14px">
    <sc-for list="{{shelf}}" as="s" hint-placeholder-count="9">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="aspect-ratio: 2 / 3; border-radius: 3px 7px 7px 3px; background: {{s.bg}}; box-shadow: 0 18px 24px -14px rgba(32,41,35,0.45)"></div>
        <div style="height: 12px; width: 70%; border-radius: 999px; background: #DEDDD2"></div>
        <div style="height: 10px; width: 45%; border-radius: 999px; background: #E4E2D8"></div>
      </div>
    </sc-for>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(32, 41, 35, 0.32)"></div>

  <!-- Bottom sheet: the desktop click-open menu, same items -->
  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 16px 34px; border-radius: 28px 28px 0 0; background: #FBFAF6; box-shadow: 0 -24px 48px -18px rgba(32,41,35,0.45); display: flex; flex-direction: column; gap: 16px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #DEDDD2"></span>

    <header style="display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <span id="sheet-title" style="font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 24px; line-height: 1.3">红楼梦</span>
        <span style="font-size: 13px; color: #4B554E">曹雪芹<span style="color: #656D66"> · 清</span></span>
      </span>
      <button type="button" aria-label="关闭" style="display: flex; flex: 0 0 44px; height: 44px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: #ECEAE2; color: #202923">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
      </button>
    </header>

    <p style="margin: 0; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 12px; background: #E8EEE8; font-size: 13px; color: #35674C"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: currentColor"></span>已读</p>

    <div role="menu" aria-labelledby="sheet-title" style="display: flex; flex-direction: column; gap: 2px">
      <a href="MobileBookDetail.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 14px; border-radius: 14px; color: #202923; text-decoration: none; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #4B554E"><path d="M5 5h5.5a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H5zM19 5h-5.5a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2H19z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>
        详情
      </a>
      <a href="MobileReader.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 14px; border-radius: 14px; color: #202923; text-decoration: none; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #4B554E"><path d="M7 17L17 7M9 7h8v8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        阅读
      </a>
      <a href="#" role="menuitem" style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 14px; border-radius: 14px; color: #202923; text-decoration: none; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #4B554E"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        下载 EPUB
      </a>
      <span aria-hidden="true" style="height: 1px; margin: 6px 14px; background: #E4E2D8"></span>
      <a href="#" role="menuitem" style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 14px; border-radius: 14px; color: #202923; text-decoration: none; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #4B554E"><path d="M4 7h16v3H4zM6 10v9h12v-9M10 14h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg>
        归档
      </a>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A24832"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var bgs = ['#7A2E2A', '#2F4A3E', '#C9A44C', '#2C3A52', '#3D3A35', '#D9CDB4', '#5A6B5D', '#8C5A3C', '#B8C2B3'];
    return {
      accent: this.props.accent ?? '#A24832',
      shelf: bgs.map(function (bg) { return { bg: bg }; })
    };
  }
}
</script>
</body>
</html>
