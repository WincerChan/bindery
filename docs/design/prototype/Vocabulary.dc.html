<meta charset="utf-8">

<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  .rail-nav{flex-direction:row}
  .rail-foot{margin-top:0 !important;margin-left:auto}
  .content{padding:24px 16px 48px !important}
  .hero-title{font-size:30px !important}
}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 100vh; padding: 32px; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; color: #202923">
<div style="max-width: 1376px; margin: 0 auto; background: #F6F4EE; border-radius: 28px; box-shadow: 0 30px 60px -30px rgba(32, 41, 35, 0.25); display: flex; flex-wrap: wrap; overflow: hidden">

  <aside class="rail" style="flex: 0 0 92px; box-sizing: border-box; padding: 32px 0; display: flex; flex-direction: column; align-items: center; gap: 44px; border-right: 1px solid #E4E2D8">
    <a href="Main.dc.html" aria-label="Bindery 首页" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; color: #202923">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 4.5h5.5a2 2 0 0 1 2 2V20a2 2 0 0 0-2-2H5zM19 4.5h-5.5a2 2 0 0 0-2 2V20a2 2 0 0 1 2-2H19z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg>
    </a>
    <nav class="rail-nav" aria-label="主导航">
      <a href="Main.dc.html" aria-label="书库" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM17 5l3-.7 3 15-3 .7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg></a>
      <a href="Ingest.dc.html" aria-label="入库" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg></a>
      <a href="Tracker.dc.html" aria-label="追踪" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg></a>
      <a href="#" aria-label="生词本" aria-current="page" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; background: {{accent}}; color: #FBFAF6"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 18l4.5-12 4.5 12M5.2 13.5h5.6M15 8h5.5M15 12h5.5M15 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
      <a href="Devices.dc.html" aria-label="设备" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18H6zM10 18h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg></a>
    </nav>
    <div class="rail-foot" style="margin-top: auto">
      <a href="SettingsHub.dc.html" aria-label="设置" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; border: 0; background: #ECEAE2; color: #4B554E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"></circle><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></a>
    </div>
  </aside>

  <main class="content" style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px 56px 64px; display: flex; flex-direction: column; gap: 48px">

    <!-- Hero: the latest word, as a pull quote -->
    <section style="display: flex; flex-wrap: wrap; align-items: center; gap: 56px; padding-top: 40px">
      <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
        <p style="margin: 0; font-size: 14px; color: #656D66; letter-spacing: 0.08em">生词本 · 从 Kindle 和 Kobo 同步 · 共 124 个</p>
        <h1 class="hero-title" style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 46px; line-height: 1.25">这个月查了 38 个词。</h1>
        <p style="margin: 0; max-width: 560px; font-size: 15px; line-height: 1.85; color: #4B554E">多半来自 <span lang="en" style="font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 17px">Pride and Prejudice</span>。右边是最近查的一个，连同查词时读到的那句话。</p>
        <p style="margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 14px; color: #4B554E">
          <span style="display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #35674C"></span>LexiTrace 已推送 120 个</span>
          <span style="display: inline-flex; align-items: center; gap: 8px; color: #A43B2B"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: currentColor"></span>2 个失败</span>
          <button type="button" style="height: 44px; padding: 0 18px; border: 1px solid #C8C8BB; border-radius: 999px; background: transparent; font: inherit; font-size: 13px; font-weight: 500; color: #202923; cursor: pointer">全部重试</button>
          <a href="VocabSettings.dc.html" aria-label="LexiTrace 设置" title="LexiTrace 设置" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 18px; border-radius: 999px; background: #ECEAE2; color: #202923; text-decoration: none; font-size: 13px; font-weight: 500">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
            设置
          </a>
        </p>
      </div>

      <figure style="flex: 0 1 520px; min-width: 0; margin: 0 24px 0 0; display: flex; flex-direction: column; gap: 18px; padding-left: 40px; border-left: 1px solid #DEDDD2">
        <p style="margin: 0; font-size: 14px; letter-spacing: 0.08em; color: #656D66">最近查的</p>
        <p style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-style: italic; font-weight: 600; font-size: 64px; line-height: 1; color: #202923">ardent</p>
        <blockquote style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 21px; line-height: 1.6; color: #2A312C">“In vain I have struggled. It will not do. My feelings will not be repressed. You must allow me to tell you how <mark>ardently</mark> I admire and love you.”</blockquote>
        <figcaption style="font-size: 13px; color: #656D66"><span style="font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 15px; color: #4B554E">Pride and Prejudice</span> · 书房的 Kindle · 昨天 23:12</figcaption>
      </figure>
    </section>

    <!-- Toolbar -->
    <section aria-labelledby="words-title" style="display: flex; flex-direction: column; gap: 24px">
      <h2 id="words-title" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">生词</h2>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
        <label style="flex: 1 1 240px; max-width: 320px; display: flex; align-items: center; gap: 10px; height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; background: #ECEAE2; color: #656D66">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"></circle><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
          <input type="search" aria-label="搜索生词、例句" placeholder="搜索生词、例句" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 14px; color: #202923; outline: none">
        </label>
        <label style="position: relative; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 18px; border-radius: 999px; background: #ECEAE2; font-size: 14px; cursor: pointer">
          <span style="color: #656D66">书</span><span style="font-weight: 500; color: #202923">全部</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #656D66"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <select aria-label="书" style="position: absolute; inset: 0; width: 100%; opacity: 0"><option>全部</option><option>Pride and Prejudice（71）</option></select>
        </label>
        <label style="position: relative; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 18px; border-radius: 999px; background: #ECEAE2; font-size: 14px; cursor: pointer">
          <span style="color: #656D66">设备</span><span style="font-weight: 500; color: #202923">全部</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #656D66"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <select aria-label="设备" style="position: absolute; inset: 0; width: 100%; opacity: 0"><option>全部</option><option>书房的 Kindle</option><option>通勤 Kobo</option></select>
        </label>
        <div role="group" aria-label="推送状态" style="display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px; background: #ECEAE2">
          <button type="button" aria-pressed="true" style="height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: #FBFAF6; box-shadow: 0 1px 2px rgba(32,41,35,0.12); font: inherit; font-size: 14px; font-weight: 500; color: #202923">全部</button>
          <button type="button" aria-pressed="false" style="height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #656D66">未推送</button>
          <button type="button" aria-pressed="false" style="height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #656D66">失败</button>
        </div>
      </div>

      <!-- Words -->
      <ul style="margin: 8px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 8px 48px">
        <sc-for list="{{words}}" as="w" hint-placeholder-count="6">
          <li style="position: relative; display: flex; flex-direction: column; gap: 12px; padding: 26px 0 18px; border-top: 1px solid #DEDDD2">
            <p style="margin: 0; display: flex; align-items: baseline; gap: 12px">
              <span lang="en" style="font-family: 'Newsreader', Georgia, serif; font-style: italic; font-weight: 600; font-size: 30px; line-height: 1.1; color: #202923">{{w.word}}</span>
              <sc-if value="{{w.inflected}}" hint-placeholder-val="{{false}}">
                <span lang="en" style="font-family: 'Newsreader', Georgia, serif; font-size: 16px; color: #656D66">{{w.raw}}</span>
              </sc-if>
              <sc-if value="{{w.flag}}" hint-placeholder-val="{{false}}">
                <span role="img" aria-label="{{w.flagLabel}}" title="{{w.flagLabel}}" style="margin-left: auto; align-self: center; width: 8px; height: 8px; box-sizing: border-box; border-radius: 999px; background: {{w.flagFill}}; border: 1.5px solid {{w.flagStroke}}"></span>
              </sc-if>
            </p>
            <p lang="en" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 17px; line-height: 1.6; color: #2A312C; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">{{w.before}}<mark>{{w.raw}}</mark>{{w.after}}</p>
            <p style="margin: 0; font-size: 13px; color: #656D66"><span lang="en" style="font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 14px; color: #4B554E">{{w.book}}</span> · {{w.device}} · {{w.when}}</p>
          </li>
        </sc-for>
      </ul>
    </section>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A24832","options":["#A24832","#C7962B","#2F5D50","#202923"]},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    var data = [
      { word: 'mortify', raw: 'mortified', before: '“I could easily forgive his pride, if he had not ', after: ' mine.”', book: 'Pride and Prejudice', device: '书房的 Kindle', when: '昨天 22:40', state: 'pushed' },
      { word: 'spleen', raw: 'spleen', before: '“It is a way I have of driving off the ', after: ' and regulating the circulation.”', book: 'Moby-Dick', device: '通勤 Kobo', when: '10-24', state: 'pending' },
      { word: 'orgastic', raw: 'orgastic', before: '“Gatsby believed in the green light, the ', after: ' future that year by year recedes before us.”', book: 'The Great Gatsby', device: '通勤 Kobo', when: '10-22', state: 'error' },
      { word: 'acknowledge', raw: 'acknowledged', before: '“It is a truth universally ', after: ', that a single man in possession of a good fortune, must be in want of a wife.”', book: 'Pride and Prejudice', device: '书房的 Kindle', when: '10-20', state: 'pushed' },
      { word: 'bear', raw: 'borne', before: '“So we beat on, boats against the current, ', after: ' back ceaselessly into the past.”', book: 'The Great Gatsby', device: '通勤 Kobo', when: '10-19', state: 'error' },
      { word: 'precisely', raw: 'precisely', before: '“Some years ago—never mind how long ', after: '—having little or no money in my purse, and nothing particular to interest me on shore…”', book: 'Moby-Dick', device: '通勤 Kobo', when: '10-15', state: 'pushed' }
    ];
    var words = data.map(function (d) {
      var flag = d.state === 'error' ? { label: '推送失败，可重试', fill: '#A43B2B', stroke: '#A43B2B' }
        : d.state === 'pending' ? { label: '还没推送到 LexiTrace', fill: 'transparent', stroke: '#92998F' } : null;
      return {
        word: d.word, raw: d.raw, inflected: d.raw !== d.word, before: d.before, after: d.after,
        book: d.book, device: d.device, when: d.when,
        flag: !!flag, flagLabel: flag ? flag.label : '', flagFill: flag ? flag.fill : '', flagStroke: flag ? flag.stroke : ''
      };
    });
    return { accent: this.props.accent ?? '#A24832', words: words };
  }
}
</script>
</body>
</html>
