<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bindery 书库</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E9E6DC}
a{color:#A24832}a:hover{color:#823624}
.rail-nav{display:flex;flex-direction:column;align-items:center;gap:10px}
.book-info .info-chev{opacity:0;transition:opacity .15s, transform .2s}
.book-info:hover .info-chev,.book-info:focus-visible .info-chev,.book-info[aria-expanded="true"] .info-chev{opacity:1}
.book-info:hover{background:#EFEDE5 !important}
@media (max-width: 760px){
  .rail{flex:1 1 100% !important;flex-direction:row !important;padding:12px 16px !important;border-right:0 !important;border-bottom:1px solid #DEDDD2}
  .rail-nav{flex-direction:row}
  .rail-foot{margin-top:0 !important;margin-left:auto}
  .content{padding:24px 16px 48px !important}
  .hero-title{font-size:30px !important}
}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 100vh; padding: 32px; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; color: #202923">
<div style="max-width: 1376px; margin: 0 auto; background: #F6F4EE; border-radius: 28px; box-shadow: 0 30px 60px -30px rgba(32, 41, 35, 0.25); display: flex; flex-wrap: wrap; overflow: hidden">

  <!-- Rail -->
  <aside class="rail" style="flex: 0 0 92px; box-sizing: border-box; padding: 32px 0; display: flex; flex-direction: column; align-items: center; gap: 44px; border-right: 1px solid #E4E2D8">
    <a href="#" aria-label="Bindery 首页" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; color: #202923">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 4.5h5.5a2 2 0 0 1 2 2V20a2 2 0 0 0-2-2H5zM19 4.5h-5.5a2 2 0 0 0-2 2V20a2 2 0 0 1 2-2H19z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg>
    </a>
    <nav class="rail-nav" aria-label="主导航">
      <a href="#" aria-label="书库" aria-current="page" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; background: {{accent}}; color: #FBFAF6">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM17 5l3-.7 3 15-3 .7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>
      </a>
      <a href="#" aria-label="入库" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg>
      </a>
      <a href="#" aria-label="追踪" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>
      </a>
      <a href="Vocabulary.dc.html" aria-label="生词本" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 18l4.5-12 4.5 12M5.2 13.5h5.6M15 8h5.5M15 12h5.5M15 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
      <a href="#" aria-label="设备" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18H6zM10 18h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg>
      </a>
    </nav>
    <div class="rail-foot" style="margin-top: auto">
      <a href="SettingsHub.dc.html" aria-label="设置" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; border: 0; background: #ECEAE2; color: #4B554E;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"></circle><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
      </a>
    </div>
  </aside>

  <!-- Content -->
  <main class="content" style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px 56px 64px; display: flex; flex-direction: column; gap: 48px">

    <!-- Hero: most recently updated -->
    <section aria-labelledby="hero-title" style="display: flex; flex-wrap: wrap; align-items: center; gap: 56px; padding-top: 40px">
      <div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
        <p style="margin: 0; font-size: 14px; color: #656D66; letter-spacing: 0.08em">书库 · 在库 48 册</p>
        <h1 id="hero-title" class="hero-title" style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 46px; line-height: 1.25; letter-spacing: 0.01em">最近阅读的，<br>是《浮生六记》。</h1>
        <p style="margin: 0; max-width: 520px; font-size: 15px; line-height: 1.85; color: #4B554E; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">清代文人沈复的自传体散文。从与妻子陈芸的闺房记乐写起，到闲情、坎坷与浪游，平常日子里见深情。</p>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 6px">
          <a href="#" style="display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 26px; border-radius: 999px; background: #202923; color: #FBFAF6; text-decoration: none; font-size: 15px; font-weight: 500">
            继续阅读
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </a>
          <a href="#" aria-label="在设备排版中预览《浮生六记》" title="设备预览" style="display: flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 999px; background: #ECEAE2; color: #202923">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18H6zM10 18h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg>
          </a>
          <a href="#" aria-label="发送《浮生六记》到设备" title="发送到设备" style="display: flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 999px; background: #ECEAE2; color: #202923">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>
          </a>
          <a href="#" aria-label="下载《浮生六记》" title="下载" style="display: flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 999px; background: #ECEAE2; color: #202923">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </a>
        </div>
      </div>
      <div style="flex: 0 1 420px; display: flex; align-items: flex-end; justify-content: center; gap: 28px; padding: 12px 0">
        <div style="width: 210px; aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 4px 10px 10px 4px; background: linear-gradient(90deg, rgba(0,0,0,0.16) 0, rgba(255,255,255,0.08) 6px, rgba(0,0,0,0) 14px), #6E3B2E; box-shadow: 0 2px 3px rgba(32,41,35,0.18), 0 34px 50px -18px rgba(60,30,20,0.55), 0 12px 24px -12px rgba(32,41,35,0.35); padding: 22px 20px; display: flex; flex-direction: column; justify-content: space-between; color: #F3E6DA; transform: rotate(-2deg)">
          <div style="border-top: 1px solid rgba(243,230,218,0.5); padding-top: 10px; font-size: 11px; letter-spacing: 0.3em">清 · 沈复</div>
          <div style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 40px; line-height: 1.15; writing-mode: vertical-rl; align-self: flex-end; letter-spacing: 0.12em">浮生六记</div>
          <div style="border-bottom: 1px solid rgba(243,230,218,0.5); padding-bottom: 10px; font-size: 11px; letter-spacing: 0.2em">&#8203;</div>
        </div>
      </div>
    </section>

    <!-- Shelf toolbar -->
    <section aria-labelledby="shelf-title" style="display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
        <h2 id="shelf-title" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">书架</h2>
        <nav aria-label="书架" style="display: flex; align-items: baseline; gap: 32px">
          <a href="#" aria-current="page" style="display: inline-flex; align-items: flex-start; gap: 6px; min-height: 44px; color: #202923; text-decoration: none; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 30px; line-height: 1.3">在库<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 13px; font-weight: 600; line-height: 1; margin-top: 4px; color: {{accent}}; font-variant-numeric: tabular-nums">48</span></a>
          <a href="#" style="display: inline-flex; align-items: flex-start; gap: 6px; min-height: 44px; color: #7A8178; text-decoration: none; font-family: 'Noto Serif SC', serif; font-weight: 500; font-size: 30px; line-height: 1.3">已归档<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 13px; font-weight: 500; line-height: 1; margin-top: 4px; font-variant-numeric: tabular-nums">6</span></a>
        </nav>
        <div style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
          <label style="display: flex; align-items: center; gap: 10px; width: 220px; height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; background: #ECEAE2; color: #656D66">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"></circle><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
            <input type="search" aria-label="搜索书名、作者" placeholder="搜索书名、作者" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 14px; color: #202923; outline: none">
          </label>
          <div role="group" aria-label="阅读状态" style="display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px; background: #ECEAE2">
            <button type="button" aria-pressed="true" style="height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: #FBFAF6; box-shadow: 0 1px 2px rgba(32,41,35,0.12); font: inherit; font-size: 14px; font-weight: 500; color: #202923; cursor: pointer">全部</button>
            <button type="button" aria-pressed="false" style="height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #656D66; cursor: pointer">未读</button>
          </div>
          <label style="position: relative; display: inline-flex; align-items: center; height: 44px; font-size: 14px; color: #656D66">
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">排序</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="position: absolute; left: 16px; pointer-events: none; color: #4B554E"><path d="M7 4v16M3.5 16.5L7 20l3.5-3.5M14 6h7M14 12h5M14 18h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <select style="appearance: none; -webkit-appearance: none; height: 44px; padding: 0 38px 0 42px; border: 0; border-radius: 999px; background: #ECEAE2; font: inherit; font-size: 14px; font-weight: 500; color: #202923; cursor: pointer">
              <option>最近修改</option>
              <option>最近导入</option>
            </select>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="position: absolute; right: 16px; pointer-events: none; color: #656D66"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </label>
          <span aria-hidden="true" style="width: 1px; height: 20px; background: #DEDDD2"></span>
          <div role="group" aria-label="显示方式" style="display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px; background: #ECEAE2">
            <button type="button" aria-label="封面墙" aria-pressed="true" style="display: flex; width: 44px; height: 36px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: #FBFAF6; color: #202923; box-shadow: 0 1px 2px rgba(32,41,35,0.12); cursor: pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h6.5v6.5H4zM13.5 4H20v6.5h-6.5zM4 13.5h6.5V20H4zM13.5 13.5H20V20h-6.5z" stroke="currentColor" stroke-width="1.7"></path></svg>
            </button>
            <button type="button" aria-label="列表" aria-pressed="false" style="display: flex; width: 44px; height: 36px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent; color: #656D66; cursor: pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
            </button>
          </div>
          <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border: 1px solid #C8C8BB; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #202923; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"></circle><path d="M8.5 12.2l2.4 2.4 4.6-4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            批量选择
          </button>
        </div>
      </div>

      <!-- Cover wall -->
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 44px 32px">
        <sc-for list="{{books}}" as="b" hint-placeholder-count="12">
          <article style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
            <a href="#" aria-label="{{b.label}}" title="{{b.hint}}" style="position: relative; display: block; text-decoration: none">
              <sc-if value="{{b.read}}" hint-placeholder-val="{{false}}">
                <svg width="18" height="30" viewBox="0 0 18 30" aria-hidden="true" style="position: absolute; top: -3px; right: 14px; z-index: 1; filter: drop-shadow(0 2px 2px rgba(32,41,35,0.25))"><path d="M0 0h18v30l-9-6-9 6z" fill="{{accent}}"></path></svg>
              </sc-if>
              <div style="width: 100%; aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 3px 8px 8px 3px; background: linear-gradient(90deg, rgba(0,0,0,0.18) 0, rgba(255,255,255,0.08) 5px, rgba(0,0,0,0) 12px), {{b.bg}}; box-shadow: 0 1px 2px rgba(32,41,35,0.16), 0 22px 30px -16px rgba(32,41,35,0.45); padding: 16px 14px; display: flex; flex-direction: column; justify-content: space-between; color: {{b.fg}}; opacity: {{b.opacity}}; filter: {{b.filter}}">
                <div style="border-top: 1px solid currentColor; opacity: 0.55; padding-top: 6px; font-size: 10px; letter-spacing: 0.25em">{{b.era}}</div>
                <div style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 24px; line-height: 1.15; writing-mode: vertical-rl; align-self: flex-end; letter-spacing: 0.1em; max-height: 70%">{{b.title}}</div>
                <div style="border-bottom: 1px solid currentColor; opacity: 0.55; padding-bottom: 6px; font-size: 10px; letter-spacing: 0.2em">{{b.author}}</div>
              </div>
              <sc-if value="{{b.failed}}" hint-placeholder-val="{{false}}">
                <span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 999px; background: #FBFAF6; color: #A43B2B; box-shadow: 0 6px 16px -6px rgba(32,41,35,0.45)">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.6L4 15.5M4 20v-4.5h4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </span>
              </sc-if>
              <sc-if value="{{b.queued}}" hint-placeholder-val="{{false}}">
                <span aria-hidden="true" style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 3px; border-radius: 999px; background: rgba(251,250,246,0.45); overflow: hidden">
                  <span style="display: block; width: 45%; height: 100%; border-radius: 999px; background: #FBFAF6"></span>
                </span>
              </sc-if>
            </a>
            <div style="position: relative; min-width: 0">
              <button type="button" class="book-info" aria-haspopup="menu" aria-expanded="{{b.expanded}}" onClick="{{b.toggle}}" style="display: flex; width: 100%; flex-direction: column; gap: 6px; min-width: 0; padding: 4px 2px; margin: -4px 0; border: 0; border-radius: 10px; background: transparent; font: inherit; text-align: left; color: inherit; cursor: pointer">
                <span style="display: flex; align-items: center; gap: 6px; width: 100%; min-width: 0">
                  <span style="flex: 1; min-width: 0; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 17px; line-height: 1.35; letter-spacing: 0.02em; color: #202923; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{b.title}}</span>
                  <svg class="info-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex: 0 0 auto; color: #92998F; transform: {{b.chevron}}"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </span>
                <span style="font-size: 13px; line-height: 1.4; color: #4B554E">{{b.author}}<span style="color: #656D66"> · {{b.era}}</span></span>
              </button>
              <sc-if value="{{b.open}}" hint-placeholder-val="{{false}}">
                <div role="menu" aria-label="《{{b.title}}》" style="position: absolute; left: -8px; top: calc(100% + 10px); z-index: 5; width: 232px; box-sizing: border-box; padding: 8px; border-radius: 18px; background: #FBFAF6; box-shadow: 0 1px 2px rgba(32,41,35,0.08), 0 24px 48px -18px rgba(32,41,35,0.45); display: flex; flex-direction: column; gap: 2px">
                  <sc-if value="{{b.hasNote}}" hint-placeholder-val="{{false}}">
                    <p style="margin: 0 0 4px; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 12px; background: {{b.noteBg}}; font-size: 13px; color: {{b.noteColor}}"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 999px; background: currentColor"></span>{{b.note}}</p>
                  </sc-if>
                  <a href="#" role="menuitem" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; color: #202923; text-decoration: none; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #4B554E"><path d="M5 5h5.5a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H5zM19 5h-5.5a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2H19z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>阅读</a>
                  <a href="#" role="menuitem" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; color: #202923; text-decoration: none; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #4B554E"><path d="M6 3h12v18H6zM10 18h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>设备预览</a>
                  <a href="#" role="menuitem" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; color: #202923; text-decoration: none; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #4B554E"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>下载</a>
                  <span aria-hidden="true" style="height: 1px; margin: 4px 12px; background: #E4E2D8"></span>
