      </div>

      <ul style="margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column">
        <sc-for list="{{words}}" as="w" hint-placeholder-count="5">
          <li style="display: flex; flex-direction: column; gap: 10px; padding: 20px 0 16px; border-top: 1px solid #DEDDD2">
            <p style="margin: 0; display: flex; align-items: baseline; gap: 10px">
              <span lang="en" style="font-family: 'Newsreader', Georgia, serif; font-style: italic; font-weight: 600; font-size: 26px; line-height: 1.1">{{w.word}}</span>
              <sc-if value="{{w.inflected}}" hint-placeholder-val="{{false}}">
                <span lang="en" style="font-family: 'Newsreader', Georgia, serif; font-size: 15px; color: #656D66">{{w.raw}}</span>
              </sc-if>
              <sc-if value="{{w.flag}}" hint-placeholder-val="{{false}}">
                <span role="img" aria-label="{{w.flagLabel}}" style="margin-left: auto; align-self: center; width: 8px; height: 8px; box-sizing: border-box; border-radius: 999px; background: {{w.flagFill}}; border: 1.5px solid {{w.flagStroke}}"></span>

            <p lang="en" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 16px; line-height: 1.6; color: #2A312C; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">{{w.before}}<mark>{{w.raw}}</mark>{{w.after}}</p>
            <p style="margin: 0; font-size: 12px; color: #656D66"><span lang="en" style="font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 14px; color: #4B554E">{{w.book}}</span> · {{w.device}} · {{w.when}}</p>

    <a href="MobileSettings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A24832","options":["#A24832","#C7962B","#2F5D50","#202923"]},"$preview":{"width":390,"height":1600}}'>
