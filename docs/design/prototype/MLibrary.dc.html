<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手机 · 书库</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141414}
.root{width:390px;height:844px;position:relative;overflow:hidden;background:#EFEFEC;font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif;color:#141414;font-size:14px}
.mono{font-family:"IBM Plex Mono","SF Mono",ui-monospace,monospace}
.top{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #D6D6D1}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;text-decoration:none;color:#141414}
.mark{width:12px;height:12px;background:#141414;position:relative;display:block}
.mark::after{content:"";position:absolute;right:-3px;top:-3px;width:5px;height:5px;border-radius:50%;background:#FF5A1F}
.ib{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#141414;border-radius:2px}
.field{height:40px;width:100%;border:1px solid #D6D6D1;background:#FAFAF8;border-radius:2px;padding:0 12px 0 34px;font:inherit;font-size:14px;color:#141414;box-sizing:border-box}
.chip{height:34px;padding:0 12px;display:inline-flex;align-items:center;gap:4px;border:1px solid #D6D6D1;border-radius:2px;background:transparent;color:#4A4A47;font:inherit;font-size:13px;white-space:nowrap;flex-shrink:0}
.chip.on{background:#141414;border-color:#141414;color:#FAFAF8}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #D6D6D1;text-decoration:none;color:inherit}
.gen{container-type:inline-size;position:relative;overflow:hidden;width:48px;height:72px;flex-shrink:0;box-shadow:0 0 0 1px rgba(20,20,20,.08)}
.gen .gi{position:absolute;inset:0;padding:12cqi 11cqi;box-sizing:border-box}
.gen .gr{width:24cqi;height:2px;background:currentColor;margin-bottom:10cqi}
.gen .ch{font-weight:700;font-size:44cqi;line-height:1}
.c-0{background:#141414;color:#FAFAF8}.c-1{background:#8C8A84;color:#141414}.c-2{background:#D6D6D1;color:#141414}.c-3{background:#3A3A38;color:#FAFAF8}.c-4{background:#BDB8AD;color:#141414}
.t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:12.5px;color:#4A4A47;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{font-family:"IBM Plex Mono","SF Mono",monospace;font-size:11px;color:#75756F;margin-top:4px;display:flex;gap:8px}
.rd{color:#2E7D4F}
.btn-sm{height:32px;padding:0 12px;display:inline-flex;align-items:center;border:1px solid #D6D6D1;background:#FAFAF8;border-radius:2px;font-size:13px;color:#141414;text-decoration:none;flex-shrink:0}
.tabs{position:absolute;left:0;right:0;bottom:0;height:78px;padding-bottom:22px;box-sizing:border-box;background:#FAFAF8;border-top:1px solid #D6D6D1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:#75756F;text-decoration:none;position:relative}
.tab svg{width:21px;height:21px}
.tab.on{color:#141414;font-weight:600}
.tab.on::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:#FF5A1F}
.fab{position:absolute;right:16px;bottom:94px;height:44px;padding:0 18px;display:flex;align-items:center;gap:6px;background:#141414;color:#FAFAF8;border-radius:2px;text-decoration:none;font-size:14px;box-shadow:0 12px 24px -12px rgba(0,0,0,.6)}
</style>
</helmet>
<div class="root">
  <div class="top">
    <a class="brand" href="#"><span class="mark"></span>Bindery</a>

  </div>

  <div style="padding: 16px 16px 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.01em">书库</h1>
      <span class="mono" style="font-size: 11.5px; color: #75756F">32 册 / 未读 27</span>
    </div>
    <label style="position: relative; display: block; margin-top: 12px">
      <span style="position: absolute; left: -9999px">搜索</span>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="position: absolute; left: 11px; top: 12px; width: 16px; height: 16px; color: #75756F"><path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="1.6"></path><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <input class="field" type="search" placeholder="搜索书名、作者">
    </label>
    <div style="display: flex; gap: 8px; margin-top: 10px; overflow-x: auto">
      <button class="chip" type="button">最近修改 ▾</button>
      <button class="chip" type="button">仅看未读</button>
      <div style="flex: 1 1 0"></div>
      <button class="chip" type="button">多选</button>
    </div>
  </div>

  <div style="border-top: 1px solid #141414">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div class="row">
        <sc-if value="{{r.img}}" hint-placeholder-val="{{false}}">
          <img src="/_blob/f476d4ab014fea242f2d26d7bd899619" alt="" style="width: 48px; height: 72px; object-fit: cover; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(20,20,20,.08)">
        </sc-if>
        <sc-if value="{{r.gen}}" hint-placeholder-val="{{true}}">
          <div class="gen c-{{r.c}}"><div class="gi"><div class="gr"></div><div class="ch">{{r.ch}}</div></div></div>
        </sc-if>
        <a href="#" style="flex: 1 1 0; min-width: 0; text-decoration: none; color: inherit">
          <div class="t">{{r.title}}</div>
          <div class="a">{{r.author}}</div>
          <div class="m"><span>{{r.fmt}}</span><span>{{r.date}}</span><sc-if value="{{r.read}}" hint-placeholder-val="{{false}}"><span class="rd">✓ 已读</span></sc-if></div>
        </a>
        <a class="btn-sm" href="#">阅读</a>
      </div>
    </sc-for>
  </div>

  <a class="fab" href="#"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width: 15px; height: 15px"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2"></path></svg>入库</a>

  <nav class="tabs" aria-label="主导航">
    <a class="tab on" href="#"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 5l3.5-.8 3 15.6-3.5.8z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>书库</a>
    <a class="tab" href="#"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4 15v5h16v-5" stroke="currentColor" stroke-width="1.6"></path></svg>入库</a>
    <a class="tab" href="#"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.6"></circle></svg>任务</a>
    <a class="tab" href="#"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>追踪</a>
    <a class="tab" href="#"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor"></circle><circle cx="12" cy="12" r="1.6" fill="currentColor"></circle><circle cx="19" cy="12" r="1.6" fill="currentColor"></circle></svg>更多</a>
  </nav>
</div>
</x-dc>
