<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bindery 发送到设备</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#A24832}a:hover{color:#823624}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 1000px; overflow: hidden; background: #E9E6DC; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; color: #202923">

  <!-- Device page behind -->
  <div aria-hidden="true" style="position: absolute; inset: 32px; border-radius: 28px; background: #F6F4EE; padding: 100px 56px 0 148px">
    <p style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 46px; line-height: 1.25">书房的 Kindle，<br>上面有 37 本书。</p>
    <div style="margin-top: 200px; display: flex; gap: 32px">
      <div style="width: 160px; height: 240px; border-radius: 3px 8px 8px 3px; background: #6E3B2E"></div>
      <div style="width: 160px; height: 240px; border-radius: 3px 8px 8px 3px; background: #2F4A3E"></div>
      <div style="width: 160px; height: 240px; border-radius: 3px 8px 8px 3px; background: #7A2E2A"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(32, 41, 35, 0.32)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="send-title" style="position: absolute; top: 0; right: 0; bottom: 0; width: 600px; box-sizing: border-box; background: #F6F4EE; border-radius: 28px 0 0 28px; box-shadow: -30px 0 60px -30px rgba(32,41,35,0.45); display: flex; flex-direction: column">

    <header style="padding: 40px 40px 8px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; gap: 12px">
        <h2 id="send-title" style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 30px">发送到书房的 Kindle</h2>
        <button type="button" aria-label="关闭" style="margin-left: auto; display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: #ECEAE2; color: #202923">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
        </button>
      </div>
    </header>

    <div style="flex: 1; min-height: 0; overflow: auto; padding: 16px 40px 24px; display: flex; flex-direction: column; gap: 28px">

      <!-- In progress -->
      <section aria-labelledby="queue-title" style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: baseline; gap: 12px">
          <h3 id="queue-title" style="margin: 0; font-size: 14px; font-weight: 400; letter-spacing: 0.08em; color: #656D66">正在传输 · 2</h3>
          <button type="button" style="margin-left: auto; height: 44px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 13px; color: #656D66">全部取消</button>
        </div>
        <div style="display: flex; align-items: center; gap: 16px">
          <span aria-hidden="true" style="flex: 0 0 36px; height: 54px; border-radius: 2px 4px 4px 2px; background: #C9A44C; box-shadow: 0 8px 12px -8px rgba(32,41,35,0.5)"></span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
            <p style="margin: 0; display: flex; gap: 10px; align-items: baseline"><span style="font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 16px">西游记</span><span style="margin-left: auto; font-size: 12px; color: #656D66">转换为 KFX</span></p>
            <div role="progressbar" aria-label="西游记 传输进度" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" style="height: 3px; border-radius: 999px; background: #E4E2D8; overflow: hidden"><div style="width: 64%; height: 100%; background: {{accent}}"></div></div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 16px">
          <span aria-hidden="true" style="flex: 0 0 36px; height: 54px; border-radius: 2px 4px 4px 2px; background: #D9CDB4; box-shadow: 0 8px 12px -8px rgba(32,41,35,0.5)"></span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
            <p style="margin: 0; display: flex; gap: 10px; align-items: baseline"><span style="font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 16px">儒林外史</span><span style="margin-left: auto; font-size: 12px; color: #656D66">排队中</span></p>
            <div aria-hidden="true" style="height: 3px; border-radius: 999px; background: #E4E2D8"></div>
          </div>
        </div>
      </section>

      <!-- Pick from library -->
      <section aria-labelledby="pick-title" style="display: flex; flex-direction: column; gap: 16px">
        <h3 id="pick-title" style="margin: 0; font-size: 14px; font-weight: 400; letter-spacing: 0.08em; color: #656D66">从书库选择</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <label style="flex: 1 1 180px; display: flex; align-items: center; gap: 10px; height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; background: #ECEAE2; color: #656D66">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"></circle><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
            <input type="search" aria-label="搜索书库" placeholder="搜索书库" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 14px; color: #202923; outline: none">
          </label>
          <div role="group" aria-label="筛选" style="display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px; background: #ECEAE2">
            <button type="button" aria-pressed="true" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: #FBFAF6; box-shadow: 0 1px 2px rgba(32,41,35,0.12); font: inherit; font-size: 14px; font-weight: 500; color: #202923">不在设备</button>
            <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #656D66">未读</button>
            <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #656D66">全部</button>
          </div>
        </div>
        <ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 18px">
          <sc-for list="{{picks}}" as="p" hint-placeholder-count="8">
            <li>
              <button type="button" aria-pressed="{{p.pressed}}" aria-label="选择《{{p.title}}》" style="width: 100%; padding: 0; border: 0; background: transparent; text-align: left; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 10px">
                <span style="position: relative; display: block; width: 100%; aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 2px 6px 6px 2px; background: linear-gradient(90deg, rgba(0,0,0,0.18) 0, rgba(255,255,255,0.08) 4px, rgba(0,0,0,0) 9px), {{p.bg}}; box-shadow: {{p.ring}}; opacity: {{p.opacity}}">
                  <span style="position: absolute; top: 10px; right: 8px; font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 13px; writing-mode: vertical-rl; letter-spacing: 0.08em; color: {{p.fg}}">{{p.title}}</span>
                  <sc-if value="{{p.sel}}" hint-placeholder-val="{{false}}">
                    <span aria-hidden="true" style="position: absolute; left: 8px; bottom: 8px; display: flex; width: 26px; height: 26px; align-items: center; justify-content: center; border-radius: 999px; background: {{accent}}; color: #FBFAF6"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 12.5l4 4L18 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
                  </sc-if>
                </span>
                <span style="font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 14px; color: #202923; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.title}}</span>
              </button>
            </li>
          </sc-for>
        </ul>
      </section>
    </div>

    <!-- Send bar -->
    <footer style="padding: 20px 40px 28px; border-top: 1px solid #E4E2D8; display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
      <label style="position: relative; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 18px; border-radius: 999px; background: #ECEAE2; font-size: 14px; cursor: pointer">
        <span style="color: #656D66">排版</span><span style="font-weight: 500; color: #202923">默认</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #656D66"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <select aria-label="排版方案" style="position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer"><option>默认</option><option>大字宽边距</option><option>编辑排版方案…</option></select>
      </label>
      <button type="button" aria-pressed="true" title="只替换 Bindery 记录的同一本书，保留文件名与阅读记录" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px 0 12px; border: 0; border-radius: 999px; background: #ECEAE2; font: inherit; font-size: 14px; color: #202923; cursor: pointer">
        <span aria-hidden="true" style="display: flex; width: 22px; height: 22px; align-items: center; justify-content: center; border-radius: 999px; background: #202923; color: #FBFAF6"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 12.5l4 4L18 8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
        覆盖同名
      </button>
      <button type="button" style="margin-left: auto; display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 26px; border: 0; border-radius: 999px; background: #202923; color: #FBFAF6; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer">
        发送<span style="font-variant-numeric: tabular-nums; opacity: 0.7">3 本</span>
      </button>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A24832","options":["#A24832","#C7962B","#2F5D50","#202923"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#A24832';
    var data = [
      { title: '三国演义', bg: '#2F4A3E', fg: '#E8E4CF', sel: true },
      { title: '老残游记', bg: '#8C5A3C', fg: '#F6E9D8', sel: true },
      { title: '长夜书', bg: '#45384A', fg: '#ECE2D8', sel: false },
      { title: '北渡', bg: '#5A6B5D', fg: '#F0EBDC', sel: true },
      { title: '山海拾遗', bg: '#B8C2B3', fg: '#273229', sel: false },
      { title: '桃花扇', bg: '#A8483B', fg: '#F8E7DC', sel: false },
      { title: '牡丹亭', bg: '#E4D7C0', fg: '#5B2A22', sel: false },
      { title: '长生殿', bg: '#3D3A35', fg: '#E9DFC8', sel: false }
    ];
    return {
      accent: accent,
      picks: data.map(function (d) {
        return {
          title: d.title, bg: d.bg, fg: d.fg, sel: d.sel,
          pressed: d.sel ? 'true' : 'false',
          ring: d.sel ? '0 0 0 3px #F6F4EE, 0 0 0 5px ' + accent : '0 10px 16px -10px rgba(32,41,35,0.5)',
          opacity: 1
        };
      })
    };
  }
}
</script>
</body>
</html>
