    <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 56px">

            <p style="margin: 0; font-family: 'Noto Serif SC', serif; font-size: 14.5px; line-height: 1.8; text-indent: 2em; text-align: justify; color: #202923">芸为余言：「此吾父母之意也。」余曰：「卿意如何？」芸曰：「君既不弃，敢不唯命。」</p>
            <p style="margin: 0; font-family: 'Noto Serif SC', serif; font-size: 14.5px; line-height: 1.8; text-indent: 2em; text-align: justify; color: #202923">是年冬，值其堂姊出阁，余又随母往。芸与余同齿而长余十月，自幼姊弟相呼，故仍呼之曰淑姊。时但见满室鲜衣，芸独通体素淡，仅新其鞋而已。见其绣制精巧，询为己作，始知其慧心不仅在笔墨也。</p>
            <p style="margin: 0; font-family: 'Noto Serif SC', serif; font-size: 14.5px; line-height: 1.8; text-indent: 2em; text-align: justify; color: #202923">其形削肩长项，瘦不露骨，眉弯目秀，顾盼神飞，唯两齿微露，似非佳相。一种缠绵之态，令人之意也消。</p>
            <p style="margin: 0; font-family: 'Noto Serif SC', serif; font-size: 14.5px; line-height: 1.8; text-indent: 2em; text-align: justify; color: #202923">索观诗稿，有仅一联，或三四句，多未成篇者。询其故，笑曰：「无师之作，愿得知己堪师者敲成之耳。」余戏题其签曰「锦囊佳句」，不知夭寿之机此已伏矣。</p>

          <p style="margin: 0; font-size: 13px; line-height: 1.7; color: #656D66">所有设备共用；发送时写进设备上的副本，书库里的书不变。</p>
        </div>

        <label style="position: relative; display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 18px; border-radius: 999px; background: #ECEAE2; font-size: 14px; cursor: pointer">

                <span aria-hidden="true" style="position: absolute; top: 3px; left: {{r.knob}}; width: 18px; height: 18px; border-radius: 999px; background: #FBFAF6; border: 2px solid #202923; box-sizing: border-box"></span>

        <details style="border-top: 1px solid #E4E2D8; padding-top: 4px">

          </summary>
        </details>

        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">

          <button type="button" style="margin-left: auto; height: 44px; padding: 0 20px; border: 1px solid #C8C8BB; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #202923">另存为</button>
          <button type="button" style="height: 44px; padding: 0 24px; border: 0; border-radius: 999px; background: #202923; color: #FBFAF6; font: inherit; font-size: 14px; font-weight: 500">保存</button>

          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A24832"},"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var ranges = [
      { label: '左右边距调整', value: '+2%', p: 40 },
      { label: '行高', value: '1.8', p: 50 },
      { label: '段间距', value: '0 em', p: 0 },
      { label: '首行缩进', value: '2 em', p: 66 }
    ].map(function (r) { return { label: r.label, value: r.value, pct: r.p + '%', knob: 'calc(' + r.p + '% - ' + (r.p * 0.18) + 'px)' }; });
    return { accent: this.props.accent ?? '#A24832', ranges: ranges };
  }
}
</script>
