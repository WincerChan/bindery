<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bindery 入库</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E9E6DC}
a{color:#A24832}a:hover{color:#823624}
.rail-nav{display:flex;flex-direction:column;align-items:center;gap:10px}

}

</helmet>
<div style="box-sizing: border-box; min-height: 100vh; padding: 32px; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; color: #202923">
<div style="max-width: 1376px; margin: 0 auto; background: #F6F4EE; border-radius: 28px; box-shadow: 0 30px 60px -30px rgba(32, 41, 35, 0.25); display: flex; flex-wrap: wrap; overflow: hidden">

  <aside class="rail" style="flex: 0 0 92px; box-sizing: border-box; padding: 32px 0; display: flex; flex-direction: column; align-items: center; gap: 44px; border-right: 1px solid #E4E2D8">
    <a href="Main.dc.html" aria-label="Bindery 首页" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; color: #202923">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 4.5h5.5a2 2 0 0 1 2 2V20a2 2 0 0 0-2-2H5zM19 4.5h-5.5a2 2 0 0 0-2 2V20a2 2 0 0 1 2-2H19z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg>
    </a>
    <nav class="rail-nav" aria-label="主导航">
      <a href="Main.dc.html" aria-label="书库" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E">

      </a>
      <a href="#" aria-label="入库" aria-current="page" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; background: {{accent}}; color: #FBFAF6">

      </a>
      <a href="#" aria-label="追踪" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>
      </a>
      <a href="Vocabulary.dc.html" aria-label="生词本" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 18l4.5-12 4.5 12M5.2 13.5h5.6M15 8h5.5M15 12h5.5M15 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
      <a href="#" aria-label="设备" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18H6zM10 18h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg>
      </a>
    </nav>
    <div class="rail-foot" style="margin-top: auto">
      <a href="SettingsHub.dc.html" aria-label="设置" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; border: 0; background: #ECEAE2; color: #4B554E;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"></circle><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
      </a>
    </div>
  </aside>

  <main class="content" style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px 56px 64px; display: flex; flex-direction: column; gap: 48px">

    <!-- Hero -->
    <section style="display: flex; flex-wrap: wrap; align-items: center; gap: 56px; padding-top: 40px">
      <div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
        <p style="margin: 0; font-size: 14px; color: #656D66; letter-spacing: 0.08em">入库 · 已选 3 个文件</p>
        <h1 class="hero-title" style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 46px; line-height: 1.25">这次放进书库的，<br>是下面这几本。</h1>
        <p style="margin: 0; max-width: 520px; font-size: 15px; line-height: 1.85; color: #4B554E">这是按当前主题排出的第一页，换规则或主题会跟着变。</p>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 6px">
          <button type="submit" style="display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #202923; color: #FBFAF6; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer">
            开始入库
            <span style="font-variant-numeric: tabular-nums; opacity: 0.7">2 本</span>
          </button>
          <button type="button" style="height: 48px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 15px; color: #656D66; cursor: pointer">清空</button>
        </div>
      </div>
      <figure aria-label="《浮生六记》按当前主题排出的第一页" style="flex: 0 1 580px; min-width: 0; margin: 0; height: 380px; display: flex; border-radius: 4px; box-shadow: 0 2px 4px rgba(32,41,35,0.1), 0 40px 60px -30px rgba(32,41,35,0.5); transform: rotate(-1.5deg)">
        <div style="flex: 1; min-width: 0; box-sizing: border-box; padding: 48px 32px; background: linear-gradient(270deg, rgba(32,41,35,0.12) 0, rgba(32,41,35,0) 28px), #FBFAF6; border-radius: 4px 0 0 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
          <p style="margin: 0; font-size: 11px; letter-spacing: 0.4em; color: #92998F">卷 一</p>
          <p style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 28px; letter-spacing: 0.2em; color: #202923">闺房记乐</p>
          <span style="width: 28px; height: 1px; background: {{accent}}"></span>
        </div>
        <div style="flex: 1; min-width: 0; box-sizing: border-box; padding: 44px 32px 36px; background: linear-gradient(90deg, rgba(32,41,35,0.10) 0, rgba(32,41,35,0) 24px), #FBFAF6; border-radius: 0 4px 4px 0; display: flex; flex-direction: column">
          <p style="margin: 0; font-family: 'Noto Serif SC', serif; font-size: 13px; line-height: 2; text-indent: 2em; text-align: justify; color: #2A312C">余生乾隆癸未冬十一月二十有二日，正值太平盛世，且在衣冠之家，居苏州沧浪亭畔，天之厚我，可谓至矣。东坡云：「事如春梦了无痕」，苟不记之笔墨，未免有辜彼苍之厚。</p>
          <p style="margin: 0; font-family: 'Noto Serif SC', serif; font-size: 13px; line-height: 2; text-indent: 2em; text-align: justify; color: #2A312C">因思《关雎》冠三百篇之首，故列夫妇于首卷，余以次递及焉。所愧少年失学，稍识之无，不过记其实情实事而已。</p>
          <p style="margin: auto 0 0; font-size: 10px; letter-spacing: 0.2em; color: #92998F; text-align: center">1</p>
        </div>
      </figure>
    </section>

    <!-- Settings toolbar -->
    <section aria-label="构建设置" style="display: flex; flex-direction: column; gap: 36px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
        <label style="position: relative; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 18px; border-radius: 999px; background: #ECEAE2; font-size: 14px; cursor: pointer">
          <span style="color: #656D66">切章</span><span style="font-weight: 500; color: #202923">默认 · v1</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #656D66"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <select aria-label="切章规则（仅 TXT）" style="position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer"><option>默认 · v1</option><option>网文常见格式 · v3</option></select>
        </label>
        <label style="position: relative; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 18px; border-radius: 999px; background: #ECEAE2; font-size: 14px; cursor: pointer">
          <span style="color: #656D66">主题</span><span style="font-weight: 500; color: #202923">默认 · v2</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #656D66"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <select aria-label="渲染主题" style="position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer"><option>默认 · v2</option><option>保持书籍样式</option></select>
        </label>
        <button type="button" aria-label="追加本批 CSS" title="追加本批 CSS" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: #ECEAE2; font: inherit; font-size: 14px; color: #4B554E; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5c-2 0-2.5 1-2.5 3s-1 3-2.5 4c1.5 1 2.5 2 2.5 4s.5 3 2.5 3M15 5c2 0 2.5 1 2.5 3s1 3 2.5 4c-1.5 1-2.5 2-2.5 4s-.5 3-2.5 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
          CSS
        </button>
        <a href="IngestJobs.dc.html" style="margin-left: auto; display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 20px; border: 1px solid #C8C8BB; border-radius: 999px; color: #202923; text-decoration: none; font-size: 14px; font-weight: 500">
          <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: {{accent}}; box-shadow: 0 0 0 4px rgba(162,72,50,0.15)"></span>
          最近任务<span style="font-variant-numeric: tabular-nums; color: #656D66">2 进行中</span>
        </a>
      </div>

      <!-- Cover wall -->
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 44px 32px">

        <article style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
          <a href="IngestBook.dc.html" aria-label="查看《浮生六记》解析结果" style="display: block; text-decoration: none">
            <div style="width: 100%; aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 3px 8px 8px 3px; background: linear-gradient(90deg, rgba(0,0,0,0.18) 0, rgba(255,255,255,0.08) 5px, rgba(0,0,0,0) 12px), #6E3B2E; box-shadow: 0 1px 2px rgba(32,41,35,0.16), 0 22px 30px -16px rgba(32,41,35,0.45); padding: 16px 14px; display: flex; flex-direction: column; justify-content: space-between; color: #F3E6DA">
              <div style="border-top: 1px solid currentColor; opacity: 0.55; padding-top: 6px; font-size: 10px; letter-spacing: 0.25em">清</div>
              <div style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 24px; line-height: 1.15; writing-mode: vertical-rl; align-self: flex-end; letter-spacing: 0.1em">浮生六记</div>
              <div style="border-bottom: 1px solid currentColor; opacity: 0.55; padding-bottom: 6px; font-size: 10px; letter-spacing: 0.2em">沈复</div>
            </div>
          </a>
          <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 2px">
            <a href="IngestBook.dc.html" style="font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 17px; line-height: 1.35; color: #202923; text-decoration: none">浮生六记</a>
            <p style="margin: 0; font-size: 13px; color: #4B554E">沈复<span style="color: #656D66"> · 42 章</span></p>
          </div>
        </article>

        <article style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
          <a href="IngestBook.dc.html" aria-label="查看《红楼梦》解析结果（书库里已有同名书，默认归入已有书籍）" title="书库里已有《红楼梦》，默认归入已有书籍" style="position: relative; display: block; text-decoration: none">
            <span aria-hidden="true" style="position: absolute; top: 10px; right: 10px; z-index: 1; display: flex; width: 32px; height: 32px; align-items: center; justify-content: center; border-radius: 999px; background: #FBFAF6; color: {{accent}}; box-shadow: 0 4px 10px -4px rgba(32,41,35,0.45)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="11" height="12" rx="2" stroke="currentColor" stroke-width="1.7"></rect><path d="M5 15V6a2 2 0 0 1 2-2h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
            </span>
            <div style="width: 100%; aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 3px 8px 8px 3px; background: linear-gradient(90deg, rgba(0,0,0,0.18) 0, rgba(255,255,255,0.08) 5px, rgba(0,0,0,0) 12px), #7A2E2A; box-shadow: 0 1px 2px rgba(32,41,35,0.16), 0 22px 30px -16px rgba(32,41,35,0.45); padding: 16px 14px; display: flex; flex-direction: column; justify-content: space-between; color: #F4E4D6">
              <div style="border-top: 1px solid currentColor; opacity: 0.55; padding-top: 6px; font-size: 10px; letter-spacing: 0.25em">清</div>
              <div style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 24px; line-height: 1.15; writing-mode: vertical-rl; align-self: flex-end; letter-spacing: 0.1em">红楼梦</div>
              <div style="border-bottom: 1px solid currentColor; opacity: 0.55; padding-bottom: 6px; font-size: 10px; letter-spacing: 0.2em">曹雪芹</div>
            </div>
          </a>
          <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 2px">
            <a href="IngestBook.dc.html" style="font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 17px; line-height: 1.35; color: #202923; text-decoration: none">红楼梦</a>
            <p style="margin: 0; font-size: 13px; color: #4B554E">曹雪芹<span style="color: #656D66"> · 120 章</span></p>
          </div>
        </article>

        <article style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
          <a href="#" aria-label="新建文本文档.txt 无法解析（文本为空或无法解码），不会入库" title="文本为空或无法解码，不会入库" style="position: relative; display: block; text-decoration: none">
            <div style="width: 100%; aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 3px 8px 8px 3px; background: #DEDDD2; display: flex; align-items: center; justify-content: center">
              <span aria-hidden="true" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 999px; background: #FBFAF6; color: #A43B2B; box-shadow: 0 6px 16px -6px rgba(32,41,35,0.45)">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 6.5v7.5M12 17.5v.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path></svg>
              </span>
            </div>
          </a>
          <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 2px; min-width: 0">
            <p style="margin: 0; font-size: 15px; line-height: 1.35; color: #656D66; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">新建文本文档.txt</p>
          </div>
        </article>

        <article style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
          <label style="display: flex; width: 100%; aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 3px 8px 8px 3px; border: 1.5px dashed #B3B7A9; align-items: center; justify-content: center; color: #4B554E; cursor: pointer">
            <input type="file" accept=".txt,.epub" multiple aria-label="继续添加文件" style="position: absolute; width: 1px; height: 1px; opacity: 0">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
          </label>
          <p style="margin: 0; padding: 0 2px; font-size: 15px; color: #656D66">继续添加</p>
        </article>
      </div>
    </section>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A24832","options":["#A24832","#C7962B","#2F5D50","#202923"]},"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#A24832' };
  }
}
</script>
</body>
</html>
