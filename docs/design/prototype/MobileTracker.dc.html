<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bindery 追踪 · 手机</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F4EE}
a{color:#A24832}a:hover{color:#202923}
.book-more:hover,.book-more:focus-visible,.book-more[aria-expanded="true"]{background:#EFEDE5 !important;color:#202923 !important}
.chip-row{scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1680px; overflow: hidden; background: #F6F4EE; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; color: #202923">

  <main style="box-sizing: border-box; padding: 28px 16px 120px; display: flex; flex-direction: column; gap: 32px">

    <!-- Hero -->
    <section style="display: flex; flex-direction: column; gap: 16px">
      <p style="margin: 0; font-size: 13px; color: #656D66; letter-spacing: 0.08em">追踪 · 共 86 本 · 52 本已入库</p>
      <h1 style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 30px; line-height: 1.3">正在读的有 3 本，<br>还有 61 本在等你。</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.8; color: #4B554E">想读的、读过的、还在连载的，都记在这里。没入库的书也可以先记下。</p>
      <div style="display: flex; align-items: center; gap: 10px">
        <button type="button" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border: 0; border-radius: 999px; background: #202923; color: #FBFAF6; font: inherit; font-size: 15px; font-weight: 500">
          添加书籍
        </button>
        <a href="#" aria-label="导出 CSV" style="display: flex; flex: 0 0 48px; height: 48px; align-items: center; justify-content: center; border-radius: 999px; background: #ECEAE2; color: #202923">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </a>
      </div>
    </section>

    <!-- Currently reading: three covers in a row -->
    <section aria-labelledby="reading-title" style="display: flex; flex-direction: column; gap: 14px">
      <h2 id="reading-title" style="margin: 0; font-size: 14px; font-weight: 400; letter-spacing: 0.08em; color: #656D66">正在读</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
        <a href="#" aria-label="浮生六记（在读）" style="display: flex; aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 3px 7px 7px 3px; background: linear-gradient(90deg, rgba(0,0,0,0.18) 0, rgba(255,255,255,0.08) 4px, rgba(0,0,0,0) 10px), #6E3B2E; box-shadow: 0 1px 2px rgba(32,41,35,0.16), 0 18px 24px -14px rgba(32,41,35,0.45); padding: 10px 9px; flex-direction: column; justify-content: space-between; color: #F3E6DA; text-decoration: none">
          <span style="border-top: 1px solid currentColor; opacity: 0.55; padding-top: 5px; font-size: 12px; letter-spacing: 0.2em">清</span>
          <span style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 18px; line-height: 1.1; writing-mode: vertical-rl; align-self: flex-end; letter-spacing: 0.08em">浮生六记</span>
          <span style="border-bottom: 1px solid currentColor; opacity: 0.55; padding-bottom: 5px; font-size: 12px">沈复</span>
        </a>
        <a href="#" aria-label="雾港来信（在读）" style="display: flex; aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 3px 7px 7px 3px; background: linear-gradient(90deg, rgba(0,0,0,0.18) 0, rgba(255,255,255,0.08) 4px, rgba(0,0,0,0) 10px), #2F4A3E; box-shadow: 0 1px 2px rgba(32,41,35,0.16), 0 18px 24px -14px rgba(32,41,35,0.45); padding: 10px 9px; flex-direction: column; justify-content: space-between; color: #E8E4CF; text-decoration: none">
          <span style="border-top: 1px solid currentColor; opacity: 0.55; padding-top: 5px; font-size: 12px; letter-spacing: 0.2em">连载</span>
          <span style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 18px; line-height: 1.1; writing-mode: vertical-rl; align-self: flex-end; letter-spacing: 0.08em">雾港来信</span>
          <span style="border-bottom: 1px solid currentColor; opacity: 0.55; padding-bottom: 5px; font-size: 12px">南乔</span>
        </a>
        <a href="#" aria-label="长夜书（在读，未入库）" style="display: flex; aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 3px 7px 7px 3px; border: 1.5px solid #C8C8BB; background: #ECEAE2; padding: 10px 9px; flex-direction: column; justify-content: space-between; color: #656D66; text-decoration: none">
          <span style="border-top: 1px solid currentColor; opacity: 0.55; padding-top: 5px; font-size: 12px; letter-spacing: 0.2em">连载</span>
          <span style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 18px; line-height: 1.1; writing-mode: vertical-rl; align-self: flex-end; letter-spacing: 0.08em">长夜书</span>
          <span style="border-bottom: 1px solid currentColor; opacity: 0.55; padding-bottom: 5px; font-size: 12px">青衫客</span>
        </a>
      </div>
    </section>

    <!-- Toolbar + list -->
    <section aria-labelledby="list-title" style="display: flex; flex-direction: column; gap: 10px">
      <h2 id="list-title" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">追踪列表</h2>
      <label style="display: flex; align-items: center; gap: 10px; height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; background: #ECEAE2; color: #656D66">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"></circle><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
        <input type="search" aria-label="搜索书名、作者、标签" placeholder="搜索书名、作者、标签" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 15px; color: #202923; outline: none">
      </label>
      <div role="group" aria-label="阅读状态" style="display: flex; padding: 4px; gap: 2px; border-radius: 999px; background: #ECEAE2">
        <button type="button" aria-pressed="true" style="flex: 1; height: 36px; border: 0; border-radius: 999px; background: #FBFAF6; box-shadow: 0 1px 2px rgba(32,41,35,0.12); font: inherit; font-size: 14px; font-weight: 500; color: #202923">全部</button>
        <button type="button" aria-pressed="false" style="flex: 1; height: 36px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #656D66">未读</button>
        <button type="button" aria-pressed="false" style="flex: 1; height: 36px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #656D66">在读</button>
        <button type="button" aria-pressed="false" style="flex: 1; height: 36px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #656D66">已读</button>
      </div>
      <div class="chip-row" style="display: flex; gap: 8px; margin: 0 -16px; padding: 0 16px; overflow-x: auto">
        <label style="position: relative; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 16px; border-radius: 999px; background: #ECEAE2; font-size: 14px">
          <span style="color: #656D66">书库</span><span style="font-weight: 500">全部</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #656D66"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <select aria-label="书库" style="position: absolute; inset: 0; width: 100%; opacity: 0"><option>全部</option><option>已入库</option><option>未入库</option></select>
        </label>
        <label style="position: relative; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 16px; border-radius: 999px; background: #ECEAE2; font-size: 14px">
          <span style="color: #656D66">连载</span><span style="font-weight: 500">全部</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #656D66"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <select aria-label="连载状态" style="position: absolute; inset: 0; width: 100%; opacity: 0"><option>全部</option><option>更新中</option><option>已断更</option><option>已完结</option></select>
        </label>
      </div>

      <!-- Rows open the same bottom sheet as the library -->
      <ul aria-label="追踪列表" style="margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
          <li style="border-top: 1px solid #ECEAE2">
            <div style="display: flex; align-items: center; gap: 14px; padding: 12px 0">
              <span aria-hidden="true" style="position: relative; flex: 0 0 44px; height: 66px; box-sizing: border-box; border-radius: 2px 5px 5px 2px; background: {{r.bg}}; border: {{r.border}}; box-shadow: {{r.shadow}}">
                <sc-if value="{{r.ribbon}}" hint-placeholder-val="{{false}}">
                  <svg width="10" height="17" viewBox="0 0 18 30" style="position: absolute; top: -2px; left: 5px"><path d="M0 0h18v30l-9-6-9 6z" fill="{{r.ribbonColor}}"></path></svg>
                </sc-if>
                <span style="position: absolute; top: 6px; right: 5px; font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 12px; line-height: 1.1; writing-mode: vertical-rl; color: {{r.fg}}">{{r.title}}</span>
              </span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <span style="font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.title}}</span>
                <span style="font-size: 13px; color: #4B554E; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.author}}<span style="color: #656D66">{{r.meta}}</span></span>
              </span>
              <span style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
                <span style="display: inline-flex; gap: 1px">
                  <sc-for list="{{r.stars}}" as="s" hint-placeholder-count="5">
                    <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.8z" fill="{{s.fill}}"></path></svg>
                  </sc-for>
                </span>
                <span style="font-size: 12px; color: #656D66; font-variant-numeric: tabular-nums">{{r.updated}}</span>
              </span>
              <a href="MobileBookSheet.dc.html" class="book-more" aria-haspopup="menu" aria-label="{{r.label}}" style="display: flex; flex: 0 0 44px; width: 44px; height: 44px; margin-right: -12px; align-items: center; justify-content: center; border-radius: 999px; color: #656D66">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5.5" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="12" cy="18.5" r="1.7"></circle></svg>
              </a>
            </div>
          </li>
        </sc-for>
      </ul>

      <!-- Pagination: same as the library -->
      <nav aria-label="分页" style="display: flex; align-items: center; gap: 12px; margin-top: 6px; padding-top: 16px; border-top: 1px solid #E4E2D8">
        <p style="margin: 0; display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums"><span style="font-family: 'Noto Serif SC', serif; font-size: 24px; font-weight: 600; color: {{accent}}">01</span><span style="font-size: 13px; color: #656D66">/ 11 页 · 共 86 本</span></p>
        <div style="margin-left: auto; display: flex; gap: 10px">
          <a href="#" aria-label="上一页" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 999px; color: #92998F; border: 1px solid #DEDDD2">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </a>
          <a href="#" aria-label="下一页" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 999px; color: #202923; border: 1px solid #C8C8BB">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </a>
        </div>
      </nav>
    </section>
  </main>

  <!-- Bottom tab bar -->
  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 6px 4px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #F6F4EE; border-top: 1px solid #E4E2D8">
    <a href="MobileLibrary.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM17 5l3-.7 3 15-3 .7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg></span>书库
    </a>
    <a href="MobileIngest.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg></span>入库
    </a>
    <a href="MobileTracker.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; font-weight: 500; color: #202923">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; border-radius: 999px; background: {{accent}}; color: #FBFAF6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg></span>追踪
    </a>
    <a href="MobileVocabulary.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 18l4.5-12 4.5 12M5.2 13.5h5.6M15 8h5.5M15 12h5.5M15 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>生词本
    </a>
    <a href="MobileSettings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"></circle><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></span>设置
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A24832"},"$preview":{"width":390,"height":1680}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#A24832';
    var data = [
      { title: '浮生六记', author: '沈复', serial: 'completed', tags: '散文', read: 'reading', lib: true, bg: '#6E3B2E', rating: null, updated: '10-27' },
      { title: '雾港来信', author: '南乔', serial: 'ongoing', tags: '悬疑、民国', read: 'reading', lib: true, bg: '#2F4A3E', rating: null, updated: '10-27' },
      { title: '长夜书', author: '青衫客', serial: 'ongoing', tags: '奇幻', read: 'reading', lib: false, rating: null, updated: '10-25' },
      { title: '红楼梦', author: '曹雪芹', serial: 'completed', tags: '古典', read: 'read', lib: true, bg: '#7A2E2A', rating: 5, updated: '10-21' },
      { title: '聊斋志异', author: '蒲松龄', serial: 'completed', tags: '志怪', read: 'read', lib: true, bg: '#3D3A35', rating: 4, updated: '10-18' },
      { title: '山海拾遗', author: '白榆', serial: 'hiatus', tags: '', read: 'read', lib: false, rating: 3, updated: '09-30' },
      { title: '镜花缘', author: '李汝珍', serial: 'completed', tags: '', read: 'unread', lib: true, bg: '#B8C2B3', rating: null, updated: '09-12' },
      { title: '北渡', author: '林鹿', serial: 'ongoing', tags: '历史', read: 'unread', lib: false, rating: null, updated: '09-03' }
    ];
    var serialText = { ongoing: '更新中', hiatus: '已断更', completed: '' };
    var readText = { reading: '在读', read: '已读', unread: '' };
    return {
      accent: accent,
      rows: data.map(function (d) {
        var parts = [serialText[d.serial], d.tags].filter(Boolean);
        var hint = [readText[d.read], d.lib ? '' : '未入库'].filter(Boolean).join('，');
        return {
          title: d.title, author: d.author, updated: d.updated,
          meta: parts.length ? ' · ' + parts.join(' · ') : '',
          fg: d.lib ? { '#6E3B2E': '#F3E6DA', '#2F4A3E': '#E8E4CF', '#7A2E2A': '#F4E4D6', '#3D3A35': '#E9DFC8', '#B8C2B3': '#273229' }[d.bg] : '#656D66',
          bg: d.lib ? 'linear-gradient(90deg, rgba(0,0,0,0.18) 0, rgba(255,255,255,0.08) 3px, rgba(0,0,0,0) 8px), ' + d.bg : '#ECEAE2',
          border: d.lib ? '0' : '1.5px solid #C8C8BB',
          shadow: d.lib ? '0 10px 14px -10px rgba(32,41,35,0.5)' : 'none',
          ribbon: d.read !== 'unread',
          ribbonColor: d.read === 'read' ? accent : '#C8C8BB',
          stars: [1, 2, 3, 4, 5].map(function (n) { return { fill: d.rating == null ? 'transparent' : (n <= d.rating ? accent : '#DEDDD2') }; }),
          label: '《' + d.title + '》的操作' + (hint ? '（' + hint + '）' : '')
        };
      })
    };
  }
}
</script>
</body>
</html>
