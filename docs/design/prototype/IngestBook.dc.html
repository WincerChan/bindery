<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bindery 入库 · 单本详情</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#A24832}a:hover{color:#823624}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 1000px; overflow: hidden; background: #E9E6DC; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; color: #202923">

  <div aria-hidden="true" style="position: absolute; inset: 32px; border-radius: 28px; background: #F6F4EE; padding: 100px 56px 0 148px">
    <p style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 46px; line-height: 1.25">这次放进书库的，<br>是下面这几本。</p>
    <div style="margin-top: 150px; display: flex; gap: 32px">
      <div style="width: 160px; height: 240px; border-radius: 3px 8px 8px 3px; background: #6E3B2E"></div>
      <div style="width: 160px; height: 240px; border-radius: 3px 8px 8px 3px; background: #7A2E2A"></div>
      <div style="width: 160px; height: 240px; border-radius: 3px 8px 8px 3px; background: #DEDDD2"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(32, 41, 35, 0.32)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="book-title" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 880px; box-sizing: border-box; padding: 48px; border-radius: 28px; background: #F6F4EE; box-shadow: 0 40px 80px -30px rgba(32,41,35,0.55); display: flex; flex-direction: column; gap: 40px">

    <button type="button" aria-label="关闭" style="position: absolute; top: 20px; right: 20px; display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: #ECEAE2; color: #202923; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
    </button>

    <div style="display: flex; gap: 48px; align-items: flex-start">
      <div aria-hidden="true" style="flex: 0 0 220px; aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 4px 10px 10px 4px; background: linear-gradient(90deg, rgba(0,0,0,0.16) 0, rgba(255,255,255,0.08) 6px, rgba(0,0,0,0) 14px), #7A2E2A; box-shadow: 0 2px 3px rgba(32,41,35,0.18), 0 34px 50px -18px rgba(60,30,20,0.55); padding: 22px 20px; display: flex; flex-direction: column; justify-content: space-between; color: #F4E4D6; transform: rotate(-2deg)">
        <div style="border-top: 1px solid rgba(244,228,214,0.5); padding-top: 10px; font-size: 11px; letter-spacing: 0.3em">清 · 曹雪芹</div>
        <div style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 44px; writing-mode: vertical-rl; align-self: flex-end; letter-spacing: 0.12em">红楼梦</div>
        <div style="border-bottom: 1px solid rgba(244,228,214,0.5); padding-bottom: 10px; font-size: 11px; letter-spacing: 0.2em">&#8203;</div>
      </div>

      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 28px">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <h2 id="book-title" style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 30px; line-height: 1.3">红楼梦</h2>
          <p style="margin: 0; font-size: 15px; color: #4B554E">曹雪芹<span style="color: #656D66"> · 120 章</span></p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 14px">
          <p style="margin: 0; font-size: 15px; line-height: 1.8; color: #4B554E">书库里已经有一本 <a href="#" style="font-family: 'Noto Serif SC', serif; font-weight: 600; text-decoration: none">《红楼梦》</a>。</p>
          <div role="group" aria-label="重复书籍的处理方式" style="display: inline-flex; align-self: flex-start; padding: 4px; gap: 2px; border-radius: 999px; background: #ECEAE2">
            <button type="button" aria-pressed="true" style="height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: #FBFAF6; box-shadow: 0 1px 2px rgba(32,41,35,0.12); font: inherit; font-size: 14px; font-weight: 500; color: #202923; cursor: pointer">归入已有</button>
            <button type="button" aria-pressed="false" style="height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #656D66; cursor: pointer">新建一本</button>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 14px">
          <h3 style="margin: 0; font-size: 14px; font-weight: 400; letter-spacing: 0.08em; color: #656D66">目录</h3>
          <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 32px; font-family: 'Noto Serif SC', serif; font-size: 15px; line-height: 1.5; color: #202923">
            <li>第一回 甄士隐梦幻识通灵</li>
            <li>第二回 贾夫人仙逝扬州城</li>
            <li>第三回 托内兄如海荐西宾</li>
            <li>第四回 薄命女偏逢薄命郎</li>
            <li>第五回 游幻境指迷十二钗</li>
            <li>第六回 贾宝玉初试云雨情</li>
            <li style="color: #656D66">…… 共 120 回</li>
          </ol>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px">
      <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #656D66; cursor: pointer">移除这本</button>
      <button type="button" style="margin-left: auto; height: 48px; padding: 0 32px; border: 0; border-radius: 999px; background: #202923; color: #FBFAF6; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer">完成</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
