<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bindery 入库 · 空状态</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E9E6DC}
a{color:#A24832}a:hover{color:#823624}
.rail-nav{display:flex;flex-direction:column;align-items:center;gap:10px}
@media (max-width: 760px){
  .rail{flex:1 1 100% !important;flex-direction:row !important;padding:12px 16px !important;border-right:0 !important;border-bottom:1px solid #DEDDD2}
  .rail-nav{flex-direction:row}
  .rail-foot{margin-top:0 !important;margin-left:auto}
  .content{padding:24px 16px 48px !important}
  .hero-title{font-size:30px !important}
}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 100vh; padding: 32px; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; color: #202923">
<div style="max-width: 1376px; margin: 0 auto; background: #F6F4EE; border-radius: 28px; box-shadow: 0 30px 60px -30px rgba(32, 41, 35, 0.25); display: flex; flex-wrap: wrap; overflow: hidden">

  <aside class="rail" style="flex: 0 0 92px; box-sizing: border-box; padding: 32px 0; display: flex; flex-direction: column; align-items: center; gap: 44px; border-right: 1px solid #E4E2D8">
    <a href="Main.dc.html" aria-label="Bindery 首页" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; color: #202923">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 4.5h5.5a2 2 0 0 1 2 2V20a2 2 0 0 0-2-2H5zM19 4.5h-5.5a2 2 0 0 0-2 2V20a2 2 0 0 1 2-2H19z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg>
    </a>
    <nav class="rail-nav" aria-label="主导航">
      <a href="Main.dc.html" aria-label="书库" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM17 5l3-.7 3 15-3 .7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>
      </a>
      <a href="#" aria-label="入库" aria-current="page" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; background: {{accent}}; color: #FBFAF6">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg>
      </a>
      <a href="#" aria-label="追踪" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>
      </a>
      <a href="Vocabulary.dc.html" aria-label="生词本" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 18l4.5-12 4.5 12M5.2 13.5h5.6M15 8h5.5M15 12h5.5M15 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
      <a href="#" aria-label="设备" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18H6zM10 18h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg>
      </a>
    </nav>
    <div class="rail-foot" style="margin-top: auto">
      <a href="SettingsHub.dc.html" aria-label="设置" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; border: 0; background: #ECEAE2; color: #4B554E;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"></circle><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
      </a>
    </div>
  </aside>

  <main class="content" style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px 56px 64px; display: flex; flex-direction: column; gap: 48px">

    <section style="display: flex; flex-direction: column; gap: 22px; padding-top: 52px">
      <p style="margin: 0; font-size: 14px; color: #656D66; letter-spacing: 0.08em">入库</p>
      <h1 class="hero-title" style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 46px; line-height: 1.25">把书放进来。</h1>
      <p style="margin: 0; max-width: 600px; font-size: 15px; line-height: 1.85; color: #4B554E">拖到这一页任何地方，或选择文件。支持 TXT 和 EPUB，可多选。</p>
      <div style="margin-top: 6px; display: flex; flex-wrap: wrap; gap: 12px">
        <label style="display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 26px; border-radius: 999px; background: #202923; color: #FBFAF6; font-size: 15px; font-weight: 500; cursor: pointer">
          <input type="file" accept=".txt,.epub" multiple style="position: absolute; width: 1px; height: 1px; opacity: 0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          选择文件
        </label>
        <a href="IngestJobs.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px; border: 1px solid #C8C8BB; border-radius: 999px; color: #202923; text-decoration: none; font-size: 15px; font-weight: 500">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"></circle><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          最近任务
        </a>
      </div>
    </section>

    <!-- Ghost wall: where the books will appear -->
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 44px 32px">
      <div style="aspect-ratio: 2 / 3; border-radius: 3px 8px 8px 3px; border: 1.5px dashed #B3B7A9; display: flex; align-items: center; justify-content: center; color: #4B554E">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
      </div>
      <div style="aspect-ratio: 2 / 3; border-radius: 3px 8px 8px 3px; background: #ECEAE2"></div>
      <div style="aspect-ratio: 2 / 3; border-radius: 3px 8px 8px 3px; background: #ECEAE2; opacity: 0.75"></div>
      <div style="aspect-ratio: 2 / 3; border-radius: 3px 8px 8px 3px; background: #ECEAE2; opacity: 0.5"></div>
      <div style="aspect-ratio: 2 / 3; border-radius: 3px 8px 8px 3px; background: #ECEAE2; opacity: 0.3"></div>
      <div style="aspect-ratio: 2 / 3; border-radius: 3px 8px 8px 3px; background: #ECEAE2; opacity: 0.15"></div>
    </div>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A24832","options":["#A24832","#C7962B","#2F5D50","#202923"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#A24832' };
  }
}
</script>
</body>
</html>
