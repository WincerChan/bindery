<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bindery 阅读 · 设置 · 手机</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#A24832}a:hover{color:#202923}
.page p{margin:0;text-indent:2em;text-align:justify}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F1E8; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; color: #202923">

  <main aria-label="阅读正文" class="page" style="position: absolute; top: 52px; bottom: 52px; left: 24px; right: 24px; overflow: hidden; font-family: 'Noto Serif SC', serif; font-size: 19px; line-height: 2; color: #202923; display: flex; flex-direction: column; gap: 4px">
    <p>人生坎坷何为乎来哉？往往皆自作孽耳，余则非也，多情重诺，爽直不羁，转因之为累。况吾父稼夫公，慷慨豪侠，急人之难，成人之事，嫁人之女，抚人之儿，指不胜屈，挥金如土，多为他人。</p>
    <p>余夫妇居家，偶有需用，不免典质。始则移东补西，继则左支右绌。</p>
  </main>

  <header style="position: absolute; top: 0; left: 0; right: 0; box-sizing: border-box; padding: 12px 12px 12px 8px; display: flex; align-items: center; gap: 8px; background: #FBFAF6; box-shadow: 0 1px 2px rgba(32,41,35,0.08), 0 18px 36px -24px rgba(32,41,35,0.45)">
    <a href="MobileBookDetail.dc.html" style="flex: 1; min-width: 0; display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding-left: 4px; color: #4B554E; text-decoration: none; font-size: 14px">
      <span style="display: flex; flex: 0 0 36px; height: 36px; align-items: center; justify-content: center; border-radius: 999px; background: #ECEAE2; color: #202923"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">浮生六记</span>
    </a>
    <a href="MobileReaderToc.dc.html" aria-label="目录与检索" style="display: flex; flex: 0 0 44px; height: 44px; align-items: center; justify-content: center; border-radius: 999px; background: #ECEAE2; color: #202923">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
    </a>
    <button type="button" aria-label="阅读设置" aria-expanded="true" style="display: flex; flex: 0 0 44px; height: 44px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: #202923; color: #FBFAF6; font-family: 'Noto Serif SC', serif; font-size: 17px; font-weight: 600">Aa</button>
  </header>

  <!-- No scrim: the text above previews every change -->
  <section role="dialog" aria-labelledby="settings-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 16px 34px; border-radius: 28px 28px 0 0; background: #FBFAF6; box-shadow: 0 -1px 2px rgba(32,41,35,0.06), 0 -24px 48px -18px rgba(32,41,35,0.45); display: flex; flex-direction: column; gap: 16px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #DEDDD2"></span>

    <header style="display: flex; align-items: center; gap: 12px">
      <h2 id="settings-title" style="flex: 1; margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 24px; line-height: 1.3">排版</h2>
      <button type="button" aria-label="关闭排版设置" style="display: flex; flex: 0 0 44px; height: 44px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: #ECEAE2; color: #202923">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
      </button>
    </header>

    <div role="group" aria-label="样式来源" style="display: flex; padding: 4px; gap: 2px; border-radius: 999px; background: #ECEAE2">
      <button type="button" aria-pressed="false" style="flex: 1; height: 36px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #656D66">书籍原样</button>
      <button type="button" aria-pressed="true" style="flex: 1; height: 36px; border: 0; border-radius: 999px; background: #FBFAF6; box-shadow: 0 1px 2px rgba(32,41,35,0.12); font: inherit; font-size: 14px; font-weight: 500; color: #202923">自定义</button>
    </div>

    <div role="group" aria-label="字体" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button type="button" aria-pressed="true" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 64px; border: 1.5px solid #202923; border-radius: 16px; background: #FBFAF6; color: #202923"><span style="font-family: 'Noto Serif SC', serif; font-size: 20px">文</span><span style="font-size: 12px">衬线</span></button>
      <button type="button" aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 64px; border: 1.5px solid transparent; border-radius: 16px; background: #ECEAE2; color: #4B554E"><span style="font-family: 'Noto Sans SC', sans-serif; font-size: 20px">文</span><span style="font-size: 12px">无衬线</span></button>
      <button type="button" aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 64px; border: 1.5px solid transparent; border-radius: 16px; background: #ECEAE2; color: #4B554E"><span style="font-family: 'IBM Plex Mono', 'Noto Sans SC', monospace; font-size: 18px">Aa</span><span style="font-size: 12px">等宽</span></button>
    </div>

    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-size: 14px">字号</span>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: #ECEAE2">
        <button type="button" aria-label="缩小字号" style="display: flex; width: 44px; height: 36px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent; font-family: 'Noto Serif SC', serif; font-size: 14px; color: #202923">A</button>
        <span style="min-width: 36px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums">19</span>
        <button type="button" aria-label="放大字号" style="display: flex; width: 44px; height: 36px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent; font-family: 'Noto Serif SC', serif; font-size: 20px; color: #202923">A</button>
      </div>
    </div>

    <sc-for list="{{ranges}}" as="r" hint-placeholder-count="3">
      <label style="display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; align-items: baseline; font-size: 14px">{{r.label}}<span style="margin-left: auto; font-variant-numeric: tabular-nums; color: #656D66">{{r.value}}</span></span>
        <span style="position: relative; display: block; height: 32px">
          <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 15px; height: 2px; border-radius: 999px; background: #DEDDD2"></span>
          <span aria-hidden="true" style="position: absolute; left: 0; top: 15px; height: 2px; width: {{r.pct}}; border-radius: 999px; background: #202923"></span>
          <span aria-hidden="true" style="position: absolute; top: 6px; left: {{r.knob}}; width: 20px; height: 20px; box-sizing: border-box; border-radius: 999px; background: #FBFAF6; border: 2px solid #202923"></span>
          <input type="range" aria-label="{{r.label}}" style="position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0">
        </span>
      </label>
    </sc-for>

    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-size: 14px">纸张</span>
      <div role="group" aria-label="背景" style="margin-left: auto; display: flex; gap: 6px">
        <button type="button" aria-label="米白" aria-pressed="true" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent"><span style="width: 32px; height: 32px; border-radius: 999px; background: #F4F1E8; box-shadow: 0 0 0 2px #FBFAF6, 0 0 0 4px #202923"></span></button>
        <button type="button" aria-label="纯白" aria-pressed="false" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent"><span style="width: 32px; height: 32px; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #DEDDD2"></span></button>
        <button type="button" aria-label="暗色" aria-pressed="false" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent"><span style="width: 32px; height: 32px; border-radius: 999px; background: #22262A"></span></button>
      </div>
    </div>

    <div role="group" aria-label="对齐" style="display: flex; padding: 4px; gap: 2px; border-radius: 999px; background: #ECEAE2">
      <button type="button" aria-pressed="true" style="flex: 1; height: 36px; border: 0; border-radius: 999px; background: #FBFAF6; box-shadow: 0 1px 2px rgba(32,41,35,0.12); font: inherit; font-size: 14px; font-weight: 500; color: #202923">两端对齐</button>
      <button type="button" aria-pressed="false" style="flex: 1; height: 36px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #656D66">左对齐</button>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A24832"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var ranges = [
      { label: '行高', value: '2.0', p: 60 },
      { label: '左右边距', value: '中', p: 50 },
      { label: '上下边距', value: '窄', p: 25 }
    ].map(function (r) { return { label: r.label, value: r.value, pct: r.p + '%', knob: 'calc(' + r.p + '% - ' + (r.p * 0.2) + 'px)' }; });
    return { accent: this.props.accent ?? '#A24832', ranges: ranges };
  }
}
</script>
</body>
</html>
