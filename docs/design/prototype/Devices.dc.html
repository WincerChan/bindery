<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bindery 设备</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E9E6DC}
a{color:#A24832}a:hover{color:#823624}
.rail-nav{display:flex;flex-direction:column;align-items:center;gap:10px}
.reader-body{transition:transform .25s ease, box-shadow .25s ease}
.reader-link:hover .reader-body,.reader-link:focus-visible .reader-body{transform:rotate(0deg) translateY(-6px) !important;box-shadow:0 2px 4px rgba(32,41,35,0.2),0 52px 70px -26px rgba(20,25,25,0.65) !important}
@media (max-width: 760px){
  .rail{flex:1 1 100% !important;flex-direction:row !important;padding:12px 16px !important;border-right:0 !important;border-bottom:1px solid #DEDDD2}
  .rail-nav{flex-direction:row}
  .rail-foot{margin-top:0 !important;margin-left:auto}
  .content{padding:24px 16px 48px !important}
  .hero-title{font-size:30px !important}
}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 100vh; padding: 32px; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; color: #202923">
<div style="max-width: 1376px; margin: 0 auto; background: #F6F4EE; border-radius: 28px; box-shadow: 0 30px 60px -30px rgba(32, 41, 35, 0.25); display: flex; flex-wrap: wrap; overflow: hidden">

  <aside class="rail" style="flex: 0 0 92px; box-sizing: border-box; padding: 32px 0; display: flex; flex-direction: column; align-items: center; gap: 44px; border-right: 1px solid #E4E2D8">
    <a href="Main.dc.html" aria-label="Bindery 首页" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; color: #202923">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 4.5h5.5a2 2 0 0 1 2 2V20a2 2 0 0 0-2-2H5zM19 4.5h-5.5a2 2 0 0 0-2 2V20a2 2 0 0 1 2-2H19z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg>
    </a>
    <nav class="rail-nav" aria-label="主导航">
      <a href="Main.dc.html" aria-label="书库" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E">

      </a>
      <a href="Ingest.dc.html" aria-label="入库" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E">

      </a>
      <a href="Tracker.dc.html" aria-label="追踪" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>
      </a>
      <a href="Vocabulary.dc.html" aria-label="生词本" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; color: #4B554E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 18l4.5-12 4.5 12M5.2 13.5h5.6M15 8h5.5M15 12h5.5M15 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
      <a href="#" aria-label="设备" aria-current="page" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; background: {{accent}}; color: #FBFAF6">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18H6zM10 18h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg>
      </a>
    </nav>
    <div class="rail-foot" style="margin-top: auto">
      <a href="SettingsHub.dc.html" aria-label="设置" style="display: flex; width: 52px; height: 52px; align-items: center; justify-content: center; border-radius: 999px; border: 0; background: #ECEAE2; color: #4B554E;">

  <main class="content" style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px 56px 64px; display: flex; flex-direction: column; gap: 48px">

    <!-- Hero: the device -->

      <div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
        <p style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #656D66; letter-spacing: 0.08em">
          <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #35674C; box-shadow: 0 0 0 4px rgba(53,103,76,0.15)"></span>
          已连接 · Kindle Paperwhite 3 · 固件 5.16.2
        </p>
        <h1 class="hero-title" style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 46px; line-height: 1.25">书房的 Kindle，<br>上面有 37 本书。</h1>
        <div style="display: flex; flex-direction: column; gap: 10px; max-width: 460px">
          <div role="img" aria-label="已枚举 1.6 GB：书籍 1.2 GB，字体 86 MB，其他 340 MB" style="display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: #E4E2D8">
            <span style="width: 74%; background: #202923"></span>
            <span style="width: 5%; background: {{accent}}; margin-left: 2px"></span>
            <span style="width: 21%; background: #B3B7A9; margin-left: 2px"></span>
          </div>
          <p style="margin: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: #656D66; font-variant-numeric: tabular-nums">
            <span><span aria-hidden="true" style="display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: #202923; margin-right: 6px"></span>书籍 1.2 GB</span>
            <span><span aria-hidden="true" style="display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: {{accent}}; margin-right: 6px"></span>字体 86 MB</span>
            <span><span aria-hidden="true" style="display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: #B3B7A9; margin-right: 6px"></span>其他 340 MB</span>
          </p>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 6px">
          <a href="DevicesSend.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 26px; border-radius: 999px; background: #202923; color: #FBFAF6; text-decoration: none; font-size: 15px; font-weight: 500">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"></path></svg>
            从书库发送
          </a>
          <a href="DevicesSend.dc.html" style="display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px; border: 1px solid #C8C8BB; border-radius: 999px; color: #202923; text-decoration: none; font-size: 14px; font-weight: 500">
            <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: {{accent}}; box-shadow: 0 0 0 4px rgba(162,72,50,0.15)"></span>
            传输中<span style="font-variant-numeric: tabular-nums; color: #656D66">2 本</span>
          </a>
          <label style="position: relative; display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px; border-radius: 999px; background: #ECEAE2; font-size: 14px; cursor: pointer">
            <span style="font-weight: 500; color: #202923">切换设备</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #656D66"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <select aria-label="切换设备" style="position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer"><option>书房的 Kindle · 已连接</option><option>通勤 Kobo · 未连接</option><option>连接新设备…</option></select>
          </label>
          <button type="button" aria-label="重新检测" title="重新检测" style="display: flex; width: 48px; height: 48px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: #ECEAE2; color: #202923; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.6L4 15.5M4 20v-4.5h4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
        </div>
      </div>

      <!-- E-reader showing the book in progress -->
      <figure style="flex: 0 1 300px; min-width: 0; margin: 0 40px 0 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
        <a href="DevicesPreview.dc.html" class="reader-link" aria-label="排版预览：用当前方案查看《浮生六记》" style="display: block; text-decoration: none; color: inherit">
        <div class="reader-body" style="width: 260px; aspect-ratio: 0.72; box-sizing: border-box; padding: 22px 18px 44px; border-radius: 22px; background: #23282A; box-shadow: 0 2px 4px rgba(32,41,35,0.2), 0 40px 60px -26px rgba(20,25,25,0.6); transform: rotate(-2deg)">
          <div style="height: 100%; box-sizing: border-box; padding: 22px 20px 14px; border-radius: 4px; background: #EDEBE4; display: flex; flex-direction: column; gap: 8px">
            <p style="margin: 0 0 6px; font-size: 9px; letter-spacing: 0.3em; color: #8A8F88; text-align: center">卷三 · 坎坷记愁</p>
            <p style="margin: 0; font-family: 'Noto Serif SC', serif; font-size: 11px; line-height: 1.95; text-indent: 2em; text-align: justify; color: #2B302C">人生坎坷何为乎来哉？往往皆自作孽耳，余则非也，多情重诺，爽直不羁，转因之为累。况吾父稼夫公，慷慨豪侠，急人之难，成人之事，嫁人之女，抚人之儿，指不胜屈，挥金如土，多为他人。</p>
            <p style="margin: auto 0 0; display: flex; justify-content: space-between; font-size: 8px; color: #8A8F88"><span>浮生六记</span><span>42%</span></p>
          </div>
        </div>
        </a>
        <figcaption style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: #656D66">正在读《浮生六记》· 读到 42% · 2 分钟前同步
          <a href="DevicesPreview.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 13px; font-weight: 500; text-decoration: none">点开机身看排版
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </a>
        </figcaption>
      </figure>
    </section>

    <!-- Shelf -->
    <section aria-labelledby="shelf-title" style="display: flex; flex-direction: column; gap: 28px">
      <h2 id="shelf-title" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">设备内容</h2>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
        <nav aria-label="设备内容" style="display: flex; align-items: baseline; gap: 32px">
          <a href="#" aria-current="page" style="display: inline-flex; align-items: flex-start; gap: 6px; min-height: 44px; color: #202923; text-decoration: none; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 30px; line-height: 1.3">书<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 13px; font-weight: 600; line-height: 1; margin-top: 4px; color: {{accent}}">37</span></a>
          <a href="DevicesFonts.dc.html" style="display: inline-flex; align-items: flex-start; gap: 6px; min-height: 44px; color: #7A8178; text-decoration: none; font-family: 'Noto Serif SC', serif; font-weight: 500; font-size: 30px; line-height: 1.3">字体<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 13px; line-height: 1; margin-top: 4px">4</span></a>
        </nav>
        <div style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
          <label style="display: flex; align-items: center; gap: 10px; width: 220px; height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; background: #ECEAE2; color: #656D66">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"></circle><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
            <input type="search" aria-label="搜索设备上的书" placeholder="搜索设备上的书" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 14px; color: #202923; outline: none">
          </label>
          <div role="group" aria-label="来源" style="display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px; background: #ECEAE2">
            <button type="button" aria-pressed="true" style="height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: #FBFAF6; box-shadow: 0 1px 2px rgba(32,41,35,0.12); font: inherit; font-size: 14px; font-weight: 500; color: #202923">全部</button>
            <button type="button" aria-pressed="false" style="height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #656D66">来自 Bindery</button>
            <button type="button" aria-pressed="false" style="height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #656D66">其他</button>
          </div>
          <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border: 1px solid #C8C8BB; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #202923; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"></circle><path d="M8.5 12.2l2.4 2.4 4.6-4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            批量选择
          </button>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 44px 32px">
        <sc-for list="{{books}}" as="b" hint-placeholder-count="12">
          <article style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
            <a href="#" aria-label="{{b.label}}" title="{{b.hint}}" style="position: relative; display: block; text-decoration: none">
              <sc-if value="{{b.done}}" hint-placeholder-val="{{false}}">
                <svg width="18" height="30" viewBox="0 0 18 30" aria-hidden="true" style="position: absolute; top: -3px; right: 14px; z-index: 1; filter: drop-shadow(0 2px 2px rgba(32,41,35,0.25))"><path d="M0 0h18v30l-9-6-9 6z" fill="{{accent}}"></path></svg>
              </sc-if>
              <div style="width: 100%; aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 3px 8px 8px 3px; background: linear-gradient(90deg, rgba(0,0,0,0.18) 0, rgba(255,255,255,0.08) 5px, rgba(0,0,0,0) 12px), {{b.bg}}; box-shadow: 0 1px 2px rgba(32,41,35,0.16), 0 22px 30px -16px rgba(32,41,35,0.45); padding: 16px 14px; display: flex; flex-direction: column; justify-content: space-between; color: {{b.fg}}">
                <div style="border-top: 1px solid currentColor; opacity: 0.55; padding-top: 6px; font-size: 10px; letter-spacing: 0.25em">{{b.era}}</div>
                <div style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 24px; line-height: 1.15; writing-mode: vertical-rl; align-self: flex-end; letter-spacing: 0.1em">{{b.title}}</div>
                <div style="border-bottom: 1px solid currentColor; opacity: 0.55; padding-bottom: 6px; font-size: 10px; letter-spacing: 0.2em">{{b.author}}</div>
              </div>
            </a>
            <div aria-hidden="true" style="height: 3px; border-radius: 999px; background: {{b.track}}; overflow: hidden"><div style="width: {{b.pct}}; height: 100%; background: {{accent}}"></div></div>
            <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 2px; min-width: 0">
              <a href="#" style="font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 17px; line-height: 1.35; color: #202923; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{b.title}}</a>
              <p style="margin: 0; font-size: 13px; color: #4B554E; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{b.author}}<span style="color: #656D66">{{b.meta}}</span></p>
            </div>
          </article>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A24832","options":["#A24832","#C7962B","#2F5D50","#202923"]},"$preview":{"width":1440,"height":1640}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#A24832';
    var data = [
      { title: '浮生六记', author: '沈复', era: '清', bg: '#6E3B2E', fg: '#F3E6DA', pct: 42 },
      { title: '雾港来信', author: '南乔', era: '连载', bg: '#2F4A3E', fg: '#E8E4CF', pct: 78 },
      { title: '红楼梦', author: '曹雪芹', era: '清', bg: '#7A2E2A', fg: '#F4E4D6', pct: 100 },
      { title: '聊斋志异', author: '蒲松龄', era: '清', bg: '#3D3A35', fg: '#E9DFC8', pct: 100 },
      { title: '水浒传', author: '施耐庵', era: '明', bg: '#2C3A52', fg: '#E3E1D6', pct: 12 },
      { title: '镜花缘', author: '李汝珍', era: '清', bg: '#B8C2B3', fg: '#273229', pct: 0 },
      { title: '世说新语', author: '刘义庆', era: '南朝宋', bg: '#5A6B5D', fg: '#F0EBDC', pct: 0 },
      { title: '桃花扇', author: '孔尚任', era: '清', bg: '#A8483B', fg: '#F8E7DC', pct: 0, other: true },
      { title: '长生殿', author: '洪昇', era: '清', bg: '#45384A', fg: '#ECE2D8', pct: 0, other: true },
      { title: '牡丹亭', author: '汤显祖', era: '明', bg: '#E4D7C0', fg: '#5B2A22', pct: 64, other: true },
      { title: '儒林外史', author: '吴敬梓', era: '清', bg: '#D9CDB4', fg: '#3A3326', pct: 0 },
      { title: '西游记', author: '吴承恩', era: '明', bg: '#C9A44C', fg: '#2B2416', pct: 0 }
    ];
    var books = data.map(function (d) {
      var state = d.pct >= 100 ? '已读完' : d.pct > 0 ? '读到 ' + d.pct + '%' : '';
      return {
        title: d.title, author: d.author, era: d.era, bg: d.bg, fg: d.fg,
        done: d.pct >= 100,
        pct: (d.pct > 0 && d.pct < 100 ? d.pct : 0) + '%',
        track: d.pct > 0 && d.pct < 100 ? '#E4E2D8' : 'transparent',
        meta: '',
        hint: [state, d.other ? '其他来源' : '来自 Bindery'].filter(Boolean).join(' · '),
        label: '《' + d.title + '》' + (state ? '，' + state : '')
      };
    });
    return { accent: accent, books: books };
  }
}
</script>
</body>
</html>
