<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bindery 书库 · 手机</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F4EE}
a{color:#A24832}a:hover{color:#202923}
.book-more:hover,.book-more:focus-visible,.book-more[aria-expanded="true"]{background:#EFEDE5 !important;color:#202923 !important}
.chip-row{scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1720px; overflow: hidden; background: #F6F4EE; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; color: #202923">

  <main style="box-sizing: border-box; padding: 28px 16px 120px; display: flex; flex-direction: column; gap: 32px">

    <!-- Hero: text left, small cover right -->
    <section aria-labelledby="hero-title" style="display: flex; flex-direction: column; gap: 16px">
      <p style="margin: 0; font-size: 13px; color: #656D66; letter-spacing: 0.08em">书库 · 在库 48 册</p>
      <div style="display: flex; align-items: flex-start; gap: 16px">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px">
          <h1 id="hero-title" style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 30px; line-height: 1.3">最近阅读的，<br>是《浮生六记》。</h1>
          <p style="margin: 0; font-size: 15px; line-height: 1.8; color: #4B554E; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">清代文人沈复的自传体散文。从与妻子陈芸的闺房记乐写起，到闲情、坎坷与浪游。</p>
        </div>
        <div aria-hidden="true" style="flex: 0 0 92px; margin-top: 6px; aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 3px 8px 8px 3px; background: linear-gradient(90deg, rgba(0,0,0,0.16) 0, rgba(255,255,255,0.08) 5px, rgba(0,0,0,0) 11px), #6E3B2E; box-shadow: 0 1px 2px rgba(32,41,35,0.16), 0 22px 30px -14px rgba(32,41,35,0.55); padding: 10px 9px; display: flex; flex-direction: column; justify-content: space-between; color: #F3E6DA; transform: rotate(-2deg)">
          <div style="border-top: 1px solid rgba(243,230,218,0.5); padding-top: 5px; font-size: 12px; letter-spacing: 0.2em">清</div>
          <div style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 19px; line-height: 1.1; writing-mode: vertical-rl; align-self: flex-end; letter-spacing: 0.08em">浮生六记</div>
          <div style="border-bottom: 1px solid rgba(243,230,218,0.5); padding-bottom: 5px; font-size: 12px; letter-spacing: 0.2em">沈复</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <a href="MobileReader.dc.html" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; border-radius: 999px; background: #202923; color: #FBFAF6; text-decoration: none; font-size: 15px; font-weight: 500">
          继续阅读
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </a>
        <a href="#" aria-label="下载《浮生六记》" style="display: flex; flex: 0 0 48px; height: 48px; align-items: center; justify-content: center; border-radius: 999px; background: #ECEAE2; color: #202923">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </a>
      </div>
    </section>

    <!-- Shelf -->
    <section aria-labelledby="shelf-title" style="display: flex; flex-direction: column; gap: 20px">
      <h2 id="shelf-title" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">书架</h2>
      <nav aria-label="书架" style="display: flex; align-items: baseline; gap: 24px">
        <a href="#" aria-current="page" style="display: inline-flex; align-items: flex-start; gap: 5px; min-height: 44px; color: #202923; text-decoration: none; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 24px; line-height: 1.4">在库<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 12px; font-weight: 600; line-height: 1; margin-top: 4px; color: {{accent}}; font-variant-numeric: tabular-nums">48</span></a>
        <a href="#" style="display: inline-flex; align-items: flex-start; gap: 5px; min-height: 44px; color: #7A8178; text-decoration: none; font-family: 'Noto Serif SC', serif; font-weight: 500; font-size: 24px; line-height: 1.4">已归档<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 12px; font-weight: 500; line-height: 1; margin-top: 4px; font-variant-numeric: tabular-nums">6</span></a>
      </nav>

      <!-- Toolbar: search owns a row; the rest share one -->
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 10px">
          <label style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; background: #ECEAE2; color: #656D66">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"></circle><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
            <input type="search" aria-label="搜索书名、作者" placeholder="搜索书名、作者" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 15px; color: #202923; outline: none">
          </label>
          <button type="button" aria-label="批量选择" style="display: flex; flex: 0 0 44px; height: 44px; align-items: center; justify-content: center; border: 1px solid #C8C8BB; border-radius: 999px; background: transparent; color: #202923; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"></circle><path d="M8.5 12.2l2.4 2.4 4.6-4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
        </div>
        <div class="chip-row" style="display: flex; align-items: center; gap: 8px; margin: 0 -16px; padding: 0 16px; overflow-x: auto">
          <div role="group" aria-label="阅读状态" style="flex: 0 0 auto; display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px; background: #ECEAE2">
            <button type="button" aria-pressed="true" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: #FBFAF6; box-shadow: 0 1px 2px rgba(32,41,35,0.12); font: inherit; font-size: 14px; font-weight: 500; color: #202923">全部</button>
            <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; color: #656D66">未读</button>
          </div>
          <label style="position: relative; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 16px; border-radius: 999px; background: #ECEAE2; font-size: 14px">
            <span style="color: #656D66">排序</span><span style="font-weight: 500">最近修改</span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #656D66"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <select aria-label="排序" style="position: absolute; inset: 0; width: 100%; opacity: 0"><option>最近修改</option><option>最近导入</option></select>
          </label>
          <div role="group" aria-label="显示方式" style="flex: 0 0 auto; display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px; background: #ECEAE2">
            <button type="button" aria-label="封面墙" aria-pressed="true" style="display: flex; width: 36px; height: 36px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: #FBFAF6; color: #202923; box-shadow: 0 1px 2px rgba(32,41,35,0.12)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h6.5v6.5H4zM13.5 4H20v6.5h-6.5zM4 13.5h6.5V20H4zM13.5 13.5H20V20h-6.5z" stroke="currentColor" stroke-width="1.7"></path></svg>
            </button>
            <button type="button" aria-label="列表" aria-pressed="false" style="display: flex; width: 36px; height: 36px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent; color: #656D66">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Cover wall: fixed 3 columns -->
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 14px; padding-top: 8px">
        <sc-for list="{{books}}" as="b" hint-placeholder-count="12">
          <article style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
            <a href="MobileBookDetail.dc.html" aria-label="{{b.label}}" style="position: relative; display: block; text-decoration: none">
              <sc-if value="{{b.read}}" hint-placeholder-val="{{false}}">
                <svg width="14" height="24" viewBox="0 0 18 30" aria-hidden="true" style="position: absolute; top: -3px; right: 10px; z-index: 1; filter: drop-shadow(0 2px 2px rgba(32,41,35,0.25))"><path d="M0 0h18v30l-9-6-9 6z" fill="{{accent}}"></path></svg>
              </sc-if>
              <div style="width: 100%; aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 3px 7px 7px 3px; background: linear-gradient(90deg, rgba(0,0,0,0.18) 0, rgba(255,255,255,0.08) 4px, rgba(0,0,0,0) 10px), {{b.bg}}; box-shadow: 0 1px 2px rgba(32,41,35,0.16), 0 18px 24px -14px rgba(32,41,35,0.45); padding: 10px 9px; display: flex; flex-direction: column; justify-content: space-between; color: {{b.fg}}; opacity: {{b.opacity}}; filter: {{b.filter}}">
                <div style="border-top: 1px solid currentColor; opacity: 0.55; padding-top: 5px; font-size: 12px; letter-spacing: 0.2em">{{b.era}}</div>
                <div style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 18px; line-height: 1.1; writing-mode: vertical-rl; align-self: flex-end; letter-spacing: 0.08em; max-height: 70%">{{b.title}}</div>
                <div style="border-bottom: 1px solid currentColor; opacity: 0.55; padding-bottom: 5px; font-size: 12px; letter-spacing: 0.15em">{{b.author}}</div>
              </div>
              <sc-if value="{{b.failed}}" hint-placeholder-val="{{false}}">
                <span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; width: 40px; height: 40px; align-items: center; justify-content: center; border-radius: 999px; background: #FBFAF6; color: #A43B2B; box-shadow: 0 6px 16px -6px rgba(32,41,35,0.45)">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.6L4 15.5M4 20v-4.5h4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </span>
              </sc-if>
              <sc-if value="{{b.queued}}" hint-placeholder-val="{{false}}">
                <span aria-hidden="true" style="position: absolute; left: 9px; right: 9px; bottom: 9px; height: 3px; border-radius: 999px; background: rgba(251,250,246,0.45); overflow: hidden"><span style="display: block; width: 45%; height: 100%; border-radius: 999px; background: #FBFAF6"></span></span>
              </sc-if>
            </a>
            <div style="display: flex; align-items: flex-start; gap: 2px; min-width: 0">
              <div style="display: flex; flex: 1; flex-direction: column; gap: 3px; min-width: 0; padding-top: 2px">
                <span style="font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 15px; line-height: 1.35; color: #202923; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{b.title}}</span>
                <span style="font-size: 12px; line-height: 1.4; color: #4B554E; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{b.author}}</span>
              </div>
              <a href="MobileBookSheet.dc.html" class="book-more" aria-haspopup="menu" aria-label="《{{b.title}}》的操作" style="display: flex; flex: 0 0 44px; width: 44px; height: 44px; margin: -10px -14px 0 -6px; align-items: center; justify-content: center; border-radius: 999px; color: #656D66">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5.5" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="12" cy="18.5" r="1.7"></circle></svg>
              </a>
            </div>
          </article>
        </sc-for>
      </div>

      <!-- Pagination -->
      <nav aria-label="分页" style="display: flex; align-items: center; gap: 12px; padding-top: 16px; border-top: 1px solid #E4E2D8">
        <p style="margin: 0; display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums"><span style="font-family: 'Noto Serif SC', serif; font-size: 24px; font-weight: 600; color: {{accent}}">01</span><span style="font-size: 13px; color: #656D66">/ 04 页 · 共 48 册</span></p>
        <div style="margin-left: auto; display: flex; gap: 10px">
          <a href="#" aria-label="上一页" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 999px; color: #92998F; border: 1px solid #DEDDD2">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </a>
          <a href="#" aria-label="下一页" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 999px; color: #202923; border: 1px solid #C8C8BB">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </a>
        </div>
      </nav>
    </section>
  </main>

  <!-- Bottom tab bar -->
  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 6px 4px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #F6F4EE; border-top: 1px solid #E4E2D8">
    <a href="MobileLibrary.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; font-weight: 500; color: #202923">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; border-radius: 999px; background: {{accent}}; color: #FBFAF6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM17 5l3-.7 3 15-3 .7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg></span>书库
    </a>
    <a href="MobileIngest.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg></span>入库
    </a>
    <a href="MobileTracker.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg></span>追踪
    </a>
    <a href="MobileVocabulary.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 18l4.5-12 4.5 12M5.2 13.5h5.6M15 8h5.5M15 12h5.5M15 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>生词本
    </a>
    <a href="MobileSettings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"></circle><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></span>设置
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A24832"},"$preview":{"width":390,"height":1720}}'>
class Component extends DCLogic {
  renderVals() {
    var books = [
      { title: '红楼梦', author: '曹雪芹', era: '清', bg: '#7A2E2A', fg: '#F4E4D6', read: true },
      { title: '三国演义', author: '罗贯中', era: '明', bg: '#2F4A3E', fg: '#E8E4CF' },
      { title: '西游记', author: '吴承恩', era: '明', bg: '#C9A44C', fg: '#2B2416', queued: true },
      { title: '水浒传', author: '施耐庵', era: '明', bg: '#2C3A52', fg: '#E3E1D6' },
      { title: '聊斋志异', author: '蒲松龄', era: '清', bg: '#3D3A35', fg: '#E9DFC8', read: true },
      { title: '儒林外史', author: '吴敬梓', era: '清', bg: '#D9CDB4', fg: '#3A3326' },
      { title: '世说新语', author: '刘义庆', era: '南朝宋', bg: '#5A6B5D', fg: '#F0EBDC' },
      { title: '老残游记', author: '刘鹗', era: '清', bg: '#8C5A3C', fg: '#F6E9D8', failed: true },
      { title: '镜花缘', author: '李汝珍', era: '清', bg: '#B8C2B3', fg: '#273229' },
      { title: '桃花扇', author: '孔尚任', era: '清', bg: '#A8483B', fg: '#F8E7DC', read: true },
      { title: '长生殿', author: '洪昇', era: '清', bg: '#45384A', fg: '#ECE2D8' },
      { title: '牡丹亭', author: '汤显祖', era: '明', bg: '#E4D7C0', fg: '#5B2A22' }
    ];
    return {
      accent: this.props.accent ?? '#A24832',
      books: books.map(function (b) {
        var states = [b.read ? '已读' : '', b.failed ? '生成失败' : '', b.queued ? '正在生成' : ''].filter(Boolean).join('，');
        return Object.assign({
          read: false, failed: false, queued: false,
          opacity: b.queued ? 0.72 : 1,
          filter: b.failed ? 'grayscale(0.9) contrast(0.85)' : 'none',
          label: '打开《' + b.title + '》详情' + (states ? '（' + states + '）' : '')
        }, b);
      })
    };
  }
}
</script>
</body>
</html>
