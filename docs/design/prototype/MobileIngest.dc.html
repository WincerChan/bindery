<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bindery 入库 · 手机</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F4EE}
a{color:#A24832}a:hover{color:#823624}
.chip-row{scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1400px; overflow: hidden; background: #F6F4EE; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; color: #202923">

  <main style="box-sizing: border-box; padding: 28px 16px 200px; display: flex; flex-direction: column; gap: 36px">

    <!-- Hero -->
    <section style="display: flex; flex-direction: column; gap: 16px">
      <p style="margin: 0; font-size: 13px; color: #656D66; letter-spacing: 0.08em">入库 · 已选 3 个文件</p>
      <h1 style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 30px; line-height: 1.3">这次放进书库的，<br>是下面这几本。</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.8; color: #4B554E">这是按当前主题排出的第一页，换规则或主题会跟着变。</p>

      <!-- One page, not a spread -->
      <figure aria-label="《浮生六记》按当前主题排出的第一页" style="margin: 12px 8px 0; box-sizing: border-box; padding: 32px 28px 22px; border-radius: 4px; background: linear-gradient(90deg, rgba(32,41,35,0.08) 0, rgba(32,41,35,0) 18px), #FBFAF6; box-shadow: 0 2px 4px rgba(32,41,35,0.1), 0 30px 44px -24px rgba(32,41,35,0.5); transform: rotate(-1.2deg); display: flex; flex-direction: column; gap: 14px">
        <p style="margin: 0; text-align: center; font-size: 10px; letter-spacing: 0.4em; color: #92998F">卷 一</p>
        <p style="margin: 0; text-align: center; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 20px; letter-spacing: 0.2em">闺房记乐</p>
        <span aria-hidden="true" style="align-self: center; width: 24px; height: 1px; background: {{accent}}"></span>
        <p style="margin: 6px 0 0; font-family: 'Noto Serif SC', serif; font-size: 13px; line-height: 2; text-indent: 2em; text-align: justify; color: #2A312C">余生乾隆癸未冬十一月二十有二日，正值太平盛世，且在衣冠之家，居苏州沧浪亭畔，天之厚我，可谓至矣。东坡云：「事如春梦了无痕」，苟不记之笔墨，未免有辜彼苍之厚。</p>
        <p style="margin: auto 0 0; font-size: 10px; letter-spacing: 0.2em; color: #92998F; text-align: center">1</p>
      </figure>
    </section>

    <section aria-label="构建设置" style="display: flex; flex-direction: column; gap: 18px">
      <!-- Settings chips scroll sideways rather than wrap -->
      <div class="chip-row" style="display: flex; gap: 8px; margin: 0 -16px; padding: 0 16px; overflow-x: auto">
        <label style="position: relative; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 16px; border-radius: 999px; background: #ECEAE2; font-size: 14px">
          <span style="color: #656D66">切章</span><span style="font-weight: 500">默认 · v1</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #656D66"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <select aria-label="切章规则（仅 TXT）" style="position: absolute; inset: 0; width: 100%; opacity: 0"><option>默认 · v1</option><option>网文常见格式 · v3</option></select>
        </label>
        <label style="position: relative; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 16px; border-radius: 999px; background: #ECEAE2; font-size: 14px">
          <span style="color: #656D66">主题</span><span style="font-weight: 500">默认 · v2</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #656D66"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <select aria-label="渲染主题" style="position: absolute; inset: 0; width: 100%; opacity: 0"><option>默认 · v2</option><option>保持书籍样式</option></select>
        </label>
        <button type="button" style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #ECEAE2; font: inherit; font-size: 14px; color: #4B554E">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5c-2 0-2.5 1-2.5 3s-1 3-2.5 4c1.5 1 2.5 2 2.5 4s.5 3 2.5 3M15 5c2 0 2.5 1 2.5 3s1 3 2.5 4c-1.5 1-2.5 2-2.5 4s-.5 3-2.5 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
          CSS
        </button>
      </div>

      <a href="MobileIngestJobs.dc.html" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px; border: 1px solid #C8C8BB; border-radius: 999px; color: #202923; text-decoration: none; font-size: 14px; font-weight: 500">
        <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: {{accent}}; box-shadow: 0 0 0 4px rgba(162,72,50,0.15)"></span>
        最近任务<span style="font-variant-numeric: tabular-nums; font-weight: 400; color: #656D66">2 进行中</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="margin-left: auto; color: #656D66"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>

      <!-- Cover wall: 3 columns -->
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 14px; padding-top: 10px">
        <article style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
          <a href="#" aria-label="查看《浮生六记》解析结果" style="display: block; text-decoration: none">
            <div style="aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 3px 7px 7px 3px; background: linear-gradient(90deg, rgba(0,0,0,0.18) 0, rgba(255,255,255,0.08) 4px, rgba(0,0,0,0) 10px), #6E3B2E; box-shadow: 0 1px 2px rgba(32,41,35,0.16), 0 18px 24px -14px rgba(32,41,35,0.45); padding: 10px 9px; display: flex; flex-direction: column; justify-content: space-between; color: #F3E6DA">
              <div style="border-top: 1px solid currentColor; opacity: 0.55; padding-top: 5px; font-size: 9px; letter-spacing: 0.2em">清</div>
              <div style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 18px; line-height: 1.1; writing-mode: vertical-rl; align-self: flex-end; letter-spacing: 0.08em">浮生六记</div>
              <div style="border-bottom: 1px solid currentColor; opacity: 0.55; padding-bottom: 5px; font-size: 9px; letter-spacing: 0.15em">沈复</div>
            </div>
          </a>
          <div style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 15px">浮生六记</span>
            <span style="font-size: 12px; color: #4B554E">沈复<span style="color: #656D66"> · 42 章</span></span>
          </div>
        </article>
        <article style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
          <a href="#" aria-label="查看《红楼梦》解析结果（书库里已有同名书，默认归入已有书籍）" style="position: relative; display: block; text-decoration: none">
            <span aria-hidden="true" style="position: absolute; top: 8px; right: 8px; z-index: 1; display: flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 999px; background: #FBFAF6; color: {{accent}}; box-shadow: 0 4px 10px -4px rgba(32,41,35,0.45)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="11" height="12" rx="2" stroke="currentColor" stroke-width="1.8"></rect><path d="M5 15V6a2 2 0 0 1 2-2h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
            </span>
            <div style="aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 3px 7px 7px 3px; background: linear-gradient(90deg, rgba(0,0,0,0.18) 0, rgba(255,255,255,0.08) 4px, rgba(0,0,0,0) 10px), #7A2E2A; box-shadow: 0 1px 2px rgba(32,41,35,0.16), 0 18px 24px -14px rgba(32,41,35,0.45); padding: 10px 9px; display: flex; flex-direction: column; justify-content: space-between; color: #F4E4D6">
              <div style="border-top: 1px solid currentColor; opacity: 0.55; padding-top: 5px; font-size: 9px; letter-spacing: 0.2em">清</div>
              <div style="font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 18px; line-height: 1.1; writing-mode: vertical-rl; align-self: flex-end; letter-spacing: 0.08em">红楼梦</div>
              <div style="border-bottom: 1px solid currentColor; opacity: 0.55; padding-bottom: 5px; font-size: 9px; letter-spacing: 0.15em">曹雪芹</div>
            </div>
          </a>
          <div style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 15px">红楼梦</span>
            <span style="font-size: 12px; color: #4B554E">归入已有</span>
          </div>
        </article>
        <article style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
          <a href="#" aria-label="新建文本文档.txt 无法解析（文本为空或无法解码），不会入库" style="display: flex; aspect-ratio: 2 / 3; border-radius: 3px 7px 7px 3px; background: #DEDDD2; align-items: center; justify-content: center; text-decoration: none">
            <span aria-hidden="true" style="display: flex; width: 40px; height: 40px; align-items: center; justify-content: center; border-radius: 999px; background: #FBFAF6; color: #A43B2B; box-shadow: 0 6px 16px -6px rgba(32,41,35,0.45)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 6.5v7.5M12 17.5v.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path></svg>
            </span>
          </a>
          <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="font-size: 13px; color: #656D66; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">新建文本文档.txt</span>
            <span style="font-size: 12px; color: #A43B2B">无法解析</span>
          </div>
        </article>
        <article style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
          <label style="position: relative; display: flex; aspect-ratio: 2 / 3; box-sizing: border-box; border-radius: 3px 7px 7px 3px; border: 1.5px dashed #B3B7A9; align-items: center; justify-content: center; color: #4B554E">
            <input type="file" accept=".txt,.epub" multiple aria-label="继续添加文件" style="position: absolute; width: 1px; height: 1px; opacity: 0">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
          </label>
          <span style="font-size: 14px; color: #656D66">继续添加</span>
        </article>
      </div>
    </section>
  </main>

  <!-- Primary action pinned above the tab bar -->
  <div style="position: absolute; left: 0; right: 0; bottom: 85px; box-sizing: border-box; padding: 12px 16px; display: flex; align-items: center; gap: 10px; background: #F6F4EE; border-top: 1px solid #E4E2D8">
    <button type="button" style="height: 48px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; font: inherit; font-size: 15px; color: #656D66">清空</button>
    <button type="submit" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; border: 0; border-radius: 999px; background: #202923; color: #FBFAF6; font: inherit; font-size: 15px; font-weight: 500">
      开始入库<span style="font-variant-numeric: tabular-nums; opacity: 0.7">2 本</span>
    </button>
  </div>

  <!-- Bottom tab bar -->
  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 6px 4px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #F6F4EE; border-top: 1px solid #E4E2D8">
    <a href="MobileLibrary.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM17 5l3-.7 3 15-3 .7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg></span>书库
    </a>
    <a href="MobileIngest.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; font-weight: 500; color: #202923">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; border-radius: 999px; background: {{accent}}; color: #FBFAF6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg></span>入库
    </a>
    <a href="MobileTracker.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg></span>追踪
    </a>
    <a href="MobileVocabulary.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 18l4.5-12 4.5 12M5.2 13.5h5.6M15 8h5.5M15 12h5.5M15 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>生词本
    </a>
    <a href="MobileSettings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"></circle><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></span>设置
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A24832","options":["#A24832","#C7962B","#2F5D50","#202923"]},"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#A24832' };
  }
}
</script>
</body>
</html>
