<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bindery 设置 · 手机</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F4EE}
a{color:#A24832}a:hover{color:#823624}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 960px; overflow: hidden; background: #F6F4EE; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; color: #202923">

  <main style="box-sizing: border-box; padding: 28px 16px 120px; display: flex; flex-direction: column; gap: 32px">
    <h1 style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 30px; line-height: 1.3">设置</h1>

    <section aria-labelledby="g-books" style="display: flex; flex-direction: column">
      <h2 id="g-books" style="margin: 0 0 6px; font-size: 14px; font-weight: 400; letter-spacing: 0.08em; color: #656D66">书怎么做出来</h2>
      <a href="SettingsRules.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 72px; border-top: 1px solid #ECEAE2; color: inherit; text-decoration: none">
        <span aria-hidden="true" style="display: flex; flex: 0 0 44px; height: 44px; align-items: center; justify-content: center; border-radius: 999px; background: #ECEAE2; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 5h14M5 10h9M5 15h14M5 20h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 500">切章规则</span><span style="font-size: 13px; color: #656D66; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">3 条 · 最近改过「网文常见格式」</span></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #92998F"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>
      <a href="SettingsThemes.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 72px; border-top: 1px solid #ECEAE2; color: inherit; text-decoration: none">
        <span aria-hidden="true" style="display: flex; flex: 0 0 44px; height: 44px; align-items: center; justify-content: center; border-radius: 999px; background: #ECEAE2; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 20V4h8a4 4 0 0 1 0 8H6M12 12l5 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 500">主题</span><span style="font-size: 13px; color: #656D66; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">2 个 · 入库默认用「默认 v2」</span></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #92998F"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>
    </section>

    <section aria-labelledby="g-account" style="display: flex; flex-direction: column">
      <h2 id="g-account" style="margin: 0 0 6px; font-size: 14px; font-weight: 400; letter-spacing: 0.08em; color: #656D66">账号与连接</h2>
      <a href="SettingsSecurity.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 72px; border-top: 1px solid #ECEAE2; color: inherit; text-decoration: none">
        <span aria-hidden="true" style="display: flex; flex: 0 0 44px; height: 44px; align-items: center; justify-content: center; border-radius: 999px; background: #ECEAE2; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9.5" rx="2" stroke="currentColor" stroke-width="1.6"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.6"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 500">安全</span><span style="font-size: 13px; color: #656D66">2 个通行密钥 · 今天用过</span></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #92998F"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>
      <a href="VocabSettings.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 72px; border-top: 1px solid #ECEAE2; color: inherit; text-decoration: none">
        <span aria-hidden="true" style="display: flex; flex: 0 0 44px; height: 44px; align-items: center; justify-content: center; border-radius: 999px; background: #ECEAE2; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3.5 18l4.5-12 4.5 12M5.2 13.5h5.6M15 8h5.5M15 12h5.5M15 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 500">LexiTrace</span><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #656D66"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 999px; background: #35674C"></span>已连接 · 生词自动推送</span></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #92998F"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>
      <div style="display: flex; align-items: center; gap: 14px; min-height: 72px; border-top: 1px solid #ECEAE2">
        <span aria-hidden="true" style="display: flex; flex: 0 0 44px; height: 44px; align-items: center; justify-content: center; border-radius: 999px; background: #ECEAE2; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="7" y="3" width="10" height="18" rx="2" stroke="currentColor" stroke-width="1.6"></rect><path d="M11 18h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 500">添加到主屏幕</span><span style="font-size: 13px; color: #656D66">像普通应用一样打开</span></span>
        <button type="button" style="flex: 0 0 auto; height: 44px; padding: 0 18px; border: 1px solid #C8C8BB; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #202923">添加</button>
      </div>
    </section>

    <!-- Devices: not a link on phones, just where to go instead -->
    <section aria-labelledby="g-devices" style="display: flex; flex-direction: column">
      <h2 id="g-devices" style="margin: 0 0 6px; font-size: 14px; font-weight: 400; letter-spacing: 0.08em; color: #656D66">设备</h2>
      <div style="display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-top: 1px solid #ECEAE2">
        <span aria-hidden="true" style="display: flex; flex: 0 0 44px; height: 44px; align-items: center; justify-content: center; border-radius: 999px; border: 1px solid #DEDDD2; color: #656D66"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 3h12v18H6zM10 18h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding-top: 2px"><span style="font-size: 16px; font-weight: 500">Kindle 与 Kobo</span><span style="font-size: 13px; line-height: 1.6; color: #656D66">手机浏览器连不上阅读器。传书、装字体、看排版预览，请在电脑上用 Chrome 或 Edge 打开 Bindery。</span></span>
      </div>
    </section>

    <form action="/logout" method="post" style="margin: 0">
      <button type="submit" style="display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; height: 48px; border: 1px solid #C8C8BB; border-radius: 999px; background: transparent; font: inherit; font-size: 15px; font-weight: 500; color: #A43B2B">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 8l-4 4 4 4M6 12h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        退出登录
      </button>
    </form>
  </main>

  <!-- Bottom tab bar -->
  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 6px 4px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #F6F4EE; border-top: 1px solid #E4E2D8">
    <a href="MobileLibrary.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM17 5l3-.7 3 15-3 .7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg></span>书库
    </a>
    <a href="MobileIngest.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v5h16v-5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg></span>入库
    </a>
    <a href="MobileTracker.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg></span>追踪
    </a>
    <a href="MobileVocabulary.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; color: #656D66">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; color: #4B554E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 18l4.5-12 4.5 12M5.2 13.5h5.6M15 8h5.5M15 12h5.5M15 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>生词本
    </a>
    <a href="MobileSettings.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; text-decoration: none; font-size: 12px; font-weight: 500; color: #202923">
      <span style="display: flex; width: 56px; height: 30px; align-items: center; justify-content: center; border-radius: 999px; background: {{accent}}; color: #FBFAF6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"></circle><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></span>设置
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A24832","options":["#A24832","#C7962B","#2F5D50","#202923"]},"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#A24832' };
  }
}
</script>
</body>
</html>
