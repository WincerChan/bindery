<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>书库 · 列表与多选</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFEFEC}
a{color:#141414}a:hover{color:#000}
.root{font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif;color:#141414;background:#EFEFEC;min-height:100vh;font-size:14px;position:relative}
.mono{font-family:"IBM Plex Mono","SF Mono",ui-monospace,monospace}
.wrap{max-width:1376px;margin:0 auto;padding:0 32px;box-sizing:border-box}
header{border-bottom:1px solid #D6D6D1}
.nav{height:52px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#141414;font-weight:700;font-size:16px;letter-spacing:-.01em}
.mark{width:14px;height:14px;background:#141414;position:relative;display:block}
.mark::after{content:"";position:absolute;right:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#FF5A1F}
.links{display:flex;height:52px;align-items:stretch}
.nl{display:flex;align-items:center;padding:0 12px;color:#4A4A47;text-decoration:none;position:relative;font-size:13.5px}
.nl.on{color:#141414;font-weight:600}
.nl.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:#FF5A1F}
.btn{height:34px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:2px;font-size:13px;font-family:inherit;cursor:pointer;text-decoration:none;box-sizing:border-box;white-space:nowrap}
.btn-sm{height:28px;padding:0 10px;font-size:12.5px}
.btn-primary{background:#141414;color:#FAFAF8;border:1px solid #141414}
.btn-secondary{background:#FAFAF8;color:#141414;border:1px solid #D6D6D1}
.btn-quiet{background:transparent;color:#4A4A47;border:1px solid transparent}
.field{height:34px;border:1px solid #D6D6D1;background:#FAFAF8;border-radius:2px;padding:0 10px;font:inherit;font-size:13px;color:#141414;box-sizing:border-box}
.chip{height:34px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;border:1px solid #D6D6D1;border-radius:2px;background:transparent;color:#4A4A47;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:#141414;border-color:#141414;color:#FAFAF8}
.seg{display:inline-flex;border:1px solid #D6D6D1;border-radius:2px;overflow:hidden;background:#FAFAF8}
.seg button{width:32px;height:32px;border:0;background:transparent;color:#75756F;display:flex;align-items:center;justify-content:center}
.seg button.on{background:#141414;color:#FAFAF8}
.thead,.item{display:grid;grid-template-columns:28px 72px minmax(0,2.4fr) minmax(0,1.4fr) 80px 120px 190px;align-items:center;column-gap:16px;padding:0 12px}
.thead{height:32px;border-bottom:1px solid #141414;font-family:"IBM Plex Mono","SF Mono",monospace;font-size:11px;letter-spacing:.06em;color:#75756F;text-transform:uppercase}
.item{padding-top:10px;padding-bottom:10px;border-bottom:1px solid #D6D6D1}
.item.sel{background:#FFE6DB}
.cb{width:16px;height:16px;accent-color:#FF5A1F;margin:0}
.gen{container-type:inline-size;position:relative;overflow:hidden;width:72px;height:108px;box-shadow:0 0 0 1px rgba(20,20,20,.08)}
.gen .gi{position:absolute;inset:0;padding:11cqi 10cqi 9cqi;box-sizing:border-box}
.gen .gr{width:20cqi;height:2px;background:currentColor;margin-bottom:8cqi}
.gen .gt{font-weight:700;font-size:15cqi;line-height:1.18;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.c-0{background:#141414;color:#FAFAF8}.c-1{background:#8C8A84;color:#141414}.c-2{background:#D6D6D1;color:#141414}.c-3{background:#3A3A38;color:#FAFAF8}.c-4{background:#BDB8AD;color:#141414}
.t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:#75756F;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{font-family:"IBM Plex Mono","SF Mono",monospace;font-size:12px;color:#4A4A47}
.bar{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);background:#141414;color:#FAFAF8;border-radius:2px;display:flex;align-items:center;gap:4px;padding:6px 6px 6px 18px;box-shadow:0 16px 36px -14px rgba(0,0,0,.55);white-space:nowrap}
.bar .bb{height:32px;padding:0 12px;background:transparent;border:0;color:#FAFAF8;font:inherit;font-size:13px;border-radius:2px;cursor:pointer}
.bar .sep{width:1px;height:18px;background:rgba(250,250,248,.2);margin:0 6px}
</style>
</helmet>
<div class="root">
  <header>
    <div class="wrap nav">
      <div style="display: flex; align-items: center; gap: 28px">
        <a class="brand" href="#"><span class="mark"></span>Bindery</a>
        <nav class="links" aria-label="主导航">
          <a class="nl on" href="#">书库</a><a class="nl" href="#">入库</a><a class="nl" href="#">任务</a><a class="nl" href="#">追踪</a><a class="nl" href="#">规则</a><a class="nl" href="#">归档</a>
        </nav>
      </div>
      <button class="btn btn-quiet" type="button" style="color: #75756F">退出</button>
    </div>
  </header>

  <main class="wrap" style="padding-top: 22px; padding-bottom: 120px">
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 18px">
      <h1 style="margin: 0 6px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em">书库</h1>
      <span class="mono" style="font-size: 12px; color: #75756F; margin-right: 14px">27 册 · 仅未读</span>
      <label style="position: relative; display: block; flex: 0 1 300px"><span style="position: absolute; left: -9999px">搜索</span>
        <input class="field" type="search" placeholder="搜索书名、作者" style="width: 100%"></label>
      <label><span style="position: absolute; left: -9999px">排序</span><select class="field"><option>最近修改</option></select></label>
      <button class="chip on" type="button">仅看未读 ×</button>
      <div style="flex: 1 1 0"></div>
      <div class="seg" role="group" aria-label="视图">
        <button type="button" aria-label="封面墙"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width: 15px; height: 15px"><path d="M4 4h6v8H4zM14 4h6v8h-6zM4 15h6v5H4zM14 15h6v5h-6z" stroke="currentColor" stroke-width="1.6"></path></svg></button>
        <button class="on" type="button" aria-label="列表"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width: 15px; height: 15px"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></button>
      </div>
      <button class="chip on" type="button">多选中</button>
      <a class="btn btn-primary" href="#">+ 入库</a>
    </div>

    <div class="thead"><span></span><span></span><span>书名 / 作者</span><span>出版</span><span>格式</span><span>更新</span><span></span></div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div class="item {{r.cls}}">
        <input class="cb" type="checkbox" checked="{{r.sel}}" aria-label="选择《{{r.title}}》">
        <div class="gen c-{{r.c}}"><div class="gi"><div class="gr"></div><div class="gt">{{r.title}}</div></div></div>
        <div style="min-width: 0">
          <div class="t">{{r.title}}</div>
          <div class="sub">{{r.author}}</div>
        </div>
        <div class="sub" style="margin: 0">{{r.pub}}</div>
        <span class="m">{{r.fmt}}</span>
        <span class="m">{{r.date}}</span>
        <div style="display: flex; gap: 4px; justify-content: flex-end">
          <a class="btn btn-secondary btn-sm" href="#">阅读</a>
          <a class="btn btn-quiet btn-sm" href="#">下载</a>
          <button class="btn btn-quiet btn-sm" type="button" style="color: #C2341B">归档</button>
        </div>
      </div>
    </sc-for>
  </main>

  <div class="bar" role="toolbar" aria-label="批量操作">
    <span style="font-size: 13px">已选 <b class="mono" style="color: #FF5A1F; font-size: 15px">3</b> 册</span>
    <span class="sep"></span>
    <button class="bb" type="button">全选本页</button>
    <button class="bb" type="button">清空</button>
    <span class="sep"></span>
    <button class="bb" type="button">批量下载</button>
    <button class="bb" type="button" style="color: #FF9E7A">批量归档</button>
    <span class="sep"></span>
    <button class="bb" type="button" style="background: #FAFAF8; color: #141414; font-weight: 500">完成</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ['长安的荔枝', '马伯庸', 0, '湖南文艺出版社 · 2022', 'TXT', '2026-10-19'],
      ['三体', '刘慈欣', 2, '重庆出版社 · 2008', 'TXT', '2026-10-18'],
      ['边城', '沈从文', 1, '—', 'TXT', '2026-10-18'],
      ['呐喊', '鲁迅', 3, '—', 'TXT', '2026-10-17'],
      ['平凡的世界', '路遥', 4, '北京十月文艺出版社', 'TXT', '2026-10-15'],
      ['白鹿原', '陈忠实', 0, '人民文学出版社 · 2012', 'EPUB', '2026-10-12']
    ];
    const rows = raw.map((r, i) => {
      const sel = i === 0 || i === 2 || i === 3;
      return { title: r[0], author: r[1], c: r[2], pub: r[3], fmt: r[4], date: r[5], sel, cls: sel ? 'sel' : '' };
    });
    return { rows };
  }
}
</script>
</body>
</html>
